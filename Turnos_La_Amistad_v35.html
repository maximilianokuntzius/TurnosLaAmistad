function initFirebase() {

    if (typeof firebase !== 'undefined') {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();
      turnosRef = db.ref('turnos_amistad');
      setSync('Conectando ☁️…');

      // Escuchar cambios en tiempo real desde cualquier dispositivo
      turnosRef.on('value', snapshot => {
        const cloudData = snapshot.val();
        if (cloudData && Array.isArray(cloudData.people)) {
          S = { ...S, ...cloudData };
          S.feriados = S.feriados || {};
          S.notas = S.notas || {};
      S.notas = S.notas || {};
          S.ov = S.ov || {};
          S.rot = S.rot || {};
          S.reglas = S.reglas || [];
          S.alt = S.alt || [];
          S.restr = S.restr || [];
          try { localStorage.setItem('turnos-amistad', JSON.stringify(S)); } catch(e){}
          isCloudReady = true;
          setSync('En línea ☁️');
          render();
        } else if (!cloudData) {
          // Primera vez: subir estado inicial a la nube
          turnosRef.set(clean(S))
            .then(() => {
              isCloudReady = true;
              setSync('En línea ☁️');
            })
            .catch(err => {
              console.warn('Error subiendo estado inicial a Firebase:', err);
              setSync('Guardado local 📱');
            });
        }
      }, err => {
        console.warn('Error en conexión Firebase:', err);
        setSync('Guardado local 📱');
      });
    } else {
      setSync('Guardado local 📱');
    }
  } catch (err) {
    console.warn('Fallo al inicializar Firebase:', err);
    setSync('Guardado local 📱');
  }
}

// Historial para Deshacer / Rehacer
let undoStack = [];

function pushUndo() {
  try {
    undoStack.push(JSON.stringify(S));
    if (undoStack.length > 30) undoStack.shift();
    redoStack = [];
    updateUndoUI();
  } catch(e){}
}

function undo() {
  if (!undoStack.length) return;
  try {
    redoStack.push(JSON.stringify(S));
    S = JSON.parse(undoStack.pop());
    commit(true);
    updateUndoUI();
    toast('Acción deshecha ↺');
  } catch(e){}
}

function redo() {
  if (!redoStack.length) return;
  try {
    undoStack.push(JSON.stringify(S));
    S = JSON.parse(redoStack.pop());
    commit(true);
    updateUndoUI();
    toast('Acción rehecha ↻');
  } catch(e){}
}

function updateUndoUI() {
  const btn = document.getElementById('btn-undo');
  if (btn) {
    btn.disabled = undoStack.length === 0;
    btn.style.opacity = undoStack.length === 0 ? '0.4' : '1';
  }
}

let perFilter = 'ALL';

const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
// Uso de hora fija 12:00:00 para evitar desfasajes por cambio de huso horario (DST)
const fromKey=k=>{
  const[a,b,c]=(k||'').split('-');
  if(!a||!b||!c) return new Date('');
  return new Date(+a,+b-1,+c, 12, 0, 0);
};
const dow=d=>(d.getDay()+6)%7;
const hh=t=>t?t.replace(/^0(\d)/,'$1'):'';
const mins=t=>{if(!t)return 0;const[a,b]=t.split(':').map(Number);return (isNaN(a)?0:a)*60+(isNaN(b)?0:b)};
// Cálculo seguro de diferencia horaria soportando cruce de medianoche
const diffMins=(ini,fin)=>{if(!ini||!fin)return 0;let m=mins(fin)-mins(ini);return m<0?m+1440:m};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>'p'+Math.random().toString(36).slice(2,8);
const dayLabel=d=>`${DOWS[dow(d)]} ${d.getDate()}`;

// Función unificada para determinar horas extras
function calcExtraMins(r, p, w, dw, isFeriado = false) {
    if (r.st !== 'W') return 0;

    let workedMins = diffMins(r.ini, r.fin);
    if (r.x) workedMins += diffMins(r.x.ini, r.x.fin);
    
    // Si trabajó en su franco fijo o es feriado completo = TODO es extra
    if (p.franco === dw || isFeriado) {
      return workedMins;
    }
    
    // Base diaria personalizada o deducida del horario del día
    let baseMins;
    if (p.dailyHours && p.dailyHours > 0) {
      baseMins = Math.round(p.dailyHours * 60);
    } else {
      let schedIni = p.ini, schedFin = p.fin;
      if (dw === 6 && p.domSchedule && p.domSchedule.includes('-')) {
        const parts = p.domSchedule.split('-');
        schedIni = parts[0].trim();
        schedFin = parts[1].trim();
      }
      const ex = (p.excep || []).find(e => e.dias && e.dias.includes(dw) && e.t1 && e.t1.ini && e.t1.fin);
      if (ex) {
        let m = diffMins(ex.t1.ini, ex.t1.fin);
        if (ex.t2 && ex.t2.ini && ex.t2.fin) m += diffMins(ex.t2.ini, ex.t2.fin);
        baseMins = m;
      } else {
        baseMins = diffMins(schedIni, schedFin);
      }
    }
    
    let extraMins = workedMins - (baseMins || 480);
    return extraMins > 0 ? extraMins : 0;
}

function isExtra(r, w, dw, isFeriado = false) {
    return calcExtraMins(r, r.p, w, dw, isFeriado) > 0;
}

/* ---------- Reporte unificado de Horas Extras ---------- */
function computeOvertimeStats(startDate, endDate) {
    let evalStart = new Date(startDate); evalStart.setHours(12,0,0,0); evalStart.setDate(evalStart.getDate() - dow(evalStart));
    let evalEnd = new Date(endDate); evalEnd.setHours(12,0,0,0); evalEnd.setDate(evalEnd.getDate() + (6 - dow(evalEnd)));
    
    const stats = S.people.map(p => ({ p: p, finalExtras: 0, weeklyData: {}, details: [] }));
    let current = new Date(evalStart);
    while(current <= evalEnd) {
        const {rows} = plan(current);
        const dw = dow(current);
        const w = S.week[dw];
        const kCurr = key(current);
        const isFeriado = !!(S.feriados && S.feriados[kCurr]);
        
        const dObj = new Date(current); dObj.setHours(12,0,0,0); dObj.setDate(dObj.getDate() - dow(dObj));
        const wId = dObj.getTime();
        const inRange = (current >= startDate && current <= endDate);
        
        stats.forEach(st => {
            const r = rows.find(x => x.p.id === st.p.id);
            if (!st.weeklyData[wId]) st.weeklyData[wId] = { workedFull: 0, dailyExtFull: 0, dailyExtInRange: 0 };
            
            if(r && r.st === 'W') {
                let workedMins = diffMins(r.ini, r.fin);
                if (r.x) workedMins += diffMins(r.x.ini, r.x.fin);
                st.weeklyData[wId].workedFull += workedMins;
                
                const extraMins = calcExtraMins(r, st.p, w, dw, isFeriado);
                if(extraMins > 0) {
                    st.weeklyData[wId].dailyExtFull += extraMins;
                    if (inRange) {
                        st.weeklyData[wId].dailyExtInRange += extraMins;
                        const hrs = Math.floor(extraMins / 60);
                        const mns = extraMins % 60;
                        const timeStr = mns > 0 ? hrs+'h '+mns+'m' : hrs+'h';
                        const tag = isFeriado ? ' (Feriado)' : (st.p.franco === dw ? ' (Franco)' : '');
                        st.details.push(`<b>${current.getDate()}/${current.getMonth()+1}</b>: +${timeStr}${tag}`);
                    }
                }
            }
        });
        current.setDate(current.getDate() + 1);
    }

    stats.forEach(st => {
        for (const wId in st.weeklyData) {
            const wd = st.weeklyData[wId];
            let weekFinalExtras = wd.dailyExtInRange;
            
            if (st.p.targetHours && st.p.targetHours > 0) {
                const targetMins = Math.round(st.p.targetHours * 60);
                const baseExcess = wd.workedFull - targetMins;
                
                if (baseExcess > wd.dailyExtFull) {
                    const baseExtraToAdd = baseExcess - wd.dailyExtFull;
                    const sun = new Date(parseInt(wId)); sun.setDate(sun.getDate() + 6);
                    
                    if (sun >= startDate && sun <= endDate) {
                        weekFinalExtras += baseExtraToAdd;
                        const hrs = Math.floor(baseExtraToAdd / 60);
                        const mns = baseExtraToAdd % 60;
                        st.details.push(`<b>Sem al ${sun.getDate()}/${sun.getMonth()+1}</b>: +${mns > 0 ? hrs+'h '+mns+'m' : hrs+'h'} (Base)`);
                    }
                }
            }
            st.finalExtras += weekFinalExtras;
        }
    });

    stats.sort((a,b) => b.finalExtras - a.finalExtras);
    return stats;
}

/* ---------- motor ---------- */
function wkIdx(d){return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000+3)/7)}
function altCaja(g,pid,d){
  const L=(g.cajas||[]).length,i=(g.personas||[]).indexOf(pid);
  if(i<0||!L||!g.desde||!(g.dias||[]).includes(dow(d)))return null;
  const d0=fromKey(g.desde);if(isNaN(d0))return null;
  const n=wkIdx(d)-wkIdx(d0);
  return g.cajas[(((i+n)%L)+L)%L];
}
function altPreview(g){
  if(!(g.personas||[]).length||!(g.cajas||[]).length||!g.desde||!(g.dias||[]).length)return'Completá personas, cajas, días y semana de arranque.';
  const nm=id=>{const x=S.people.find(q=>q.id===id);return x?x.name:'?'};
  const out=[];const d=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  for(let n=0;n<70&&out.length<3;n++,d.setDate(d.getDate()+1)){
    if(!g.dias.includes(dow(d)))continue;
    out.push(`${DOWS[dow(d)]} ${d.getDate()}/${d.getMonth()+1}: `+g.personas.map(id=>`${nm(id)} → ${altCaja(g,id,d)}`).join(', '));
  }
  return 'Próximas: '+out.join(' | ');
}
function cajasOrden(){
  const ac=S.cajasAC||[],pr=(S.prio||[]).filter(c=>c>=1&&c<=S.cajas&&!ac.includes(c));
  const rest=Array.from({length:S.cajas},(_,i)=>i+1).filter(c=>!pr.includes(c)&&!ac.includes(c));
  return[...pr,...rest,...ac.filter(c=>c>=1&&c<=S.cajas)];
}
function freeSlot(rows,sh,dw,pp){
  const w = S.week[dw];
  const okc=c=>!pp||!(S.restr||[]).some(g=>+g.caja===c&&!(g.personas||[]).includes(pp.id));
  const used=new Set();
  rows.forEach(r=>{if(r.st==='W'&&r.sh===sh&&r.caja)used.add(+r.caja);if(r.st==='W'&&r.x&&r.x.sh===sh)used.add(+r.x.caja)});
  for(const r of rows){
    if(r.st!=='W'&&r.p.shift===sh&&r.p.caja&&!used.has(+r.p.caja)&&okc(+r.p.caja))return{caja:+r.p.caja,ini:r.p.ini,fin:r.p.fin,cubre:r.p.name};
  }
  for(const c of cajasOrden())if(!used.has(c)&&okc(c))return{caja:c,ini:w['h'+sh][0],fin:w['h'+sh][1]};
  return{caja:null,ini:w['h'+sh][0],fin:w['h'+sh][1]};
}
function count(rows){const c={M:0,T:0};rows.forEach(r=>{if(r.st==='W'&&r.sh)c[r.sh]++;if(r.st==='W'&&r.x&&!r.x.pat)c[r.x.sh]++});return c}

function plan(d){
  const k=key(d),dw=dow(d),o=S.ov[k]||{},w=S.week[dw];
  const rows=S.people.map(p=>{
    let a;
    if(o[p.id])a={...o[p.id],mod:true};
    else if(p.franco===dw || (!w.M && p.shift==='M') || (!w.T && p.shift==='T' && !(dw===6 && w.M && p.domSchedule && p.domSchedule.includes('-')))) a={st:'F'};
    else if(p.shift==='V')a={st:'W',sh:null};
    else {
      let i=p.ini, f=p.fin, sh=p.shift;
      if (dw === 6 && p.domSchedule && p.domSchedule.includes('-')) {
        const parts = p.domSchedule.split('-');
        i = parts[0].trim(); f = parts[1].trim();
        sh = 'M';
      }
      const ex=(p.excep||[]).find(e=>e.dias&&e.dias.includes(dw)&&e.t1&&e.t1.ini&&e.t1.fin);
      if(ex){
        const rotC=(S.rot&&S.rot[k]&&S.rot[k][p.id])||p.caja||1;
        const c1=(+ex.t1.caja)>0?+ex.t1.caja:rotC;
        a={st:'W',sh:sh,caja:c1,ini:ex.t1.ini,fin:ex.t1.fin,ac:!!p.isAC,pat:true,patRot:!((+ex.t1.caja)>0)};
        if(ex.t2&&ex.t2.ini&&ex.t2.fin)a.x={sh:sh,caja:+ex.t2.caja||1,ini:ex.t2.ini,fin:ex.t2.fin,pat:true};
      }else{
        a={st:'W',sh:sh,caja:(S.rot&&S.rot[k]&&S.rot[k][p.id])||p.caja||1,ini:i,fin:f,ac:!!p.isAC};
        const al=(S.alt||[]).find(g=>altCaja(g,p.id,d)!=null);
        if(al){a.caja=altCaja(al,p.id,d);a.pat=true;a.ac=(S.cajasAC||[]).includes(+a.caja)}
      }
    }
    a.p=p;
    if(a.ac === undefined) a.ac = !!p.isAC;
    if(a.st==='W' && (!a.caja || a.caja < 1)) a.caja = p.caja || 1;
    return a;
  });
  rows.filter(r=>r.st==='W'&&!r.sh).forEach(r=>{
    if(!w.M && !w.T){ r.st='F'; return; }
    const c=count(rows);
    let sh = 'M';
    if(w.M && w.T) sh = (w.nM-c.M)>=(w.nT-c.T)?'M':'T';
    else if(!w.M) sh = 'T';
    const s=freeSlot(rows,sh,dw,r.p);
    Object.assign(r,{sh,caja:s.caja||1,ini:s.ini,fin:s.fin,cubre:s.cubre,auto:true,ac:!!r.p.isAC});
  });
  return{rows,c:count(rows)};
}

function setOv(d,pid,val,skipUndo=false){
  if(!skipUndo) pushUndo();
  const k=key(d);
  S.ov[k]=S.ov[k]||{};
  if(val) S.ov[k][pid]=val;
  else {
    delete S.ov[k][pid];
    if(!Object.keys(S.ov[k]).length) delete S.ov[k];
  }
}
function snap(r){return{st:r.st,sh:r.sh||null,caja:r.caja||1,ini:r.ini||null,fin:r.fin||null,ac:!!r.ac,...(r.x?{x:r.x}:{})}}

function proposals(d,sh){
  const{rows,c}=plan(d);const dw=dow(d),w=S.week[dw];
  const other=sh==='M'?'T':'M';const slot=freeSlot(rows,sh,dw);
  const cajaTxt=slot.caja?`Caja ${slot.caja}`:'Sin caja libre';
  const out=[];
  if(w[other] && c[other]>w['n'+other]){
    rows.filter(r=>r.st==='W'&&r.sh===other).sort((a,b)=>(b.p.shift==='V')-(a.p.shift==='V')).forEach(r=>{
      out.push({kind:'Mover',title:`Pasar a ${r.p.name} al turno ${SHN[sh]}`,
        det:`${cajaTxt}, ${hh(slot.ini)} a ${hh(slot.fin)}. ${SHN[other]} queda con ${c[other]-1}/${w['n'+other]}.`,
        apply:()=>setOv(d,r.p.id,{st:'W',sh,caja:slot.caja,ini:slot.ini,fin:slot.fin})});
    });
  }
  const mon=new Date(d);mon.setDate(d.getDate()-dow(d));
  rows.filter(r=>r.st==='F').forEach(r=>{
    let swap=null;
    for(let i=0;i<7&&!swap;i++){
      const d2=new Date(mon);d2.setDate(mon.getDate()+i);if(key(d2)===key(d))continue;
      const pl=plan(d2);const rr=pl.rows.find(x=>x.p.id===r.p.id);
      const w2=S.week[dow(d2)];
      if(rr&&rr.st==='W'&&!rr.x&&w2[rr.sh]&&pl.c[rr.sh]>w2['n'+rr.sh])swap=d2;
    }
    if(swap)out.push({kind:'Cambio de franco',title:`${r.p.name} trabaja este día y toma el franco el ${dayLabel(swap)}`,
      det:`${cajaTxt}, ${hh(slot.ini)} a ${hh(slot.fin)}. El ${dayLabel(swap)} sobra gente en su turno, así que nadie queda corto.`,
      apply:()=>{setOv(d,r.p.id,{st:'W',sh,caja:slot.caja,ini:slot.ini,fin:slot.fin});setOv(swap,r.p.id,{st:'F'})}});
    else out.push({kind:'Franco pendiente',warn:true,title:`${r.p.name} trabaja en su franco`,
      det:`${cajaTxt}, ${hh(slot.ini)} a ${hh(slot.fin)}. Esta semana no hay otro día con gente de sobra: el franco queda pendiente de devolver.`,
      apply:()=>setOv(d,r.p.id,{st:'W',sh,caja:slot.caja,ini:slot.ini,fin:slot.fin})});
  });
  if (w[other]){
    const ext=rows.filter(r=>r.st==='W'&&r.sh===other&&!r.x).map(r=>{
      const x=sh==='T'?{sh,caja:slot.caja,ini:r.fin,fin:slot.fin}:{sh,caja:slot.caja,ini:slot.ini,fin:r.ini};
      const gap=sh==='T'?Math.abs(mins(slot.ini)-mins(r.fin)):Math.abs(mins(r.ini)-mins(slot.fin));
      const tot=(diffMins(r.ini,r.fin)+diffMins(x.ini,x.fin))/60;
      return{r,x,gap,tot};
    }).filter(e=>mins(e.x.fin)>mins(e.x.ini)).sort((a,b)=>a.gap-b.gap||a.tot-b.tot).slice(0,2);
    ext.forEach(e=>out.push({kind:'Extender horario',warn:e.tot>9,
      title:sh==='T'?`${e.r.p.name} se queda hasta las ${hh(e.x.fin)}`:`${e.r.p.name} entra a las ${hh(e.x.ini)}`,
      det:`Cubre ${cajaTxt.toLowerCase()} de ${hh(e.x.ini)} a ${hh(e.x.fin)}. Jornada total: ${String(+e.tot.toFixed(1)).replace('.',',')} h.`,
      apply:()=>setOv(d,e.r.p.id,{...snap(e.r),x:e.x})}));
  }
  return out.slice(0,6);
}

function monthDays(){
  const n=new Date(Y,M+1,0).getDate();
  return Array.from({length:n},(_,i)=>new Date(Y,M,i+1, 12, 0, 0));
}
/* ---------- reglas de cajas y rotación ---------- */
function occOf(rows){
  const m=new Set(),t=new Set();
  rows.forEach(r=>{
    if(r.st!=='W')return;
    if(r.sh&&r.caja)(r.sh==='M'?m:t).add(+r.caja);
    if(r.x&&r.x.caja)(r.x.sh==='M'?m:t).add(+r.x.caja);
  });
  return{m,t};
}
function reglaFallas(g,occ,dw){
  const w=S.week[dw];
  if(!g.dias.includes(dw)||!w.M||!w.T)return[];
  const cajas=g.cajas.filter(c=>c>=1&&c<=S.cajas);
  if(!cajas.length)return[];
  const ok=cajas.filter(c=>occ.m.has(c)&&occ.t.has(c));
  if(g.modo==='alguna')return ok.length?[]:cajas;
  return cajas.filter(c=>!ok.includes(c));
}
function mismaCaja(){
  const out=[],ac=S.cajasAC||[];
  monthDays().forEach(d=>{
    const it=[];
    plan(d).rows.forEach(r=>{
      if(r.st==='W'&&r.sh&&r.caja)it.push({p:r.p,sh:r.sh,c:+r.caja,a:mins(r.ini),b:mins(r.fin)});
      if(r.st==='W'&&r.x&&r.x.caja)it.push({p:r.p,sh:r.x.sh,c:+r.x.caja,a:mins(r.x.ini),b:mins(r.x.fin)});
    });
    const seen=new Set();
    for(let i=0;i<it.length;i++)for(let j=i+1;j<it.length;j++){
      const x=it[i],y=it[j];
      if(x.p.id===y.p.id||x.c!==y.c||x.sh!==y.sh||ac.includes(x.c)||!(x.a<y.b&&y.a<x.b))continue;
      const k=x.sh+x.c;if(seen.has(k))continue;seen.add(k);
      const names=it.filter(q=>q.c===x.c&&q.sh===x.sh&&q.a<Math.max(x.b,y.b)&&Math.min(x.a,y.a)<q.b).map(q=>q.p.name);
      out.push({d,txt:`${SHN[x.sh]} caja ${x.c}: ${[...new Set(names)].join(' + ')}`});
    }
  });
  return out;
}
function reglasFallidas(){
  const out=[];
  monthDays().forEach(d=>{
    const occ=occOf(plan(d).rows);
    (S.reglas||[]).forEach(g=>{
      const f=reglaFallas(g,occ,dow(d));
      if(f.length)out.push({d,g,f,txt:'Caja '+f.join(g.modo==='alguna'?' o ':', ')});
    });
  });
  return out;
}

/* Optimización asíncrona de rotación de cajas */
async function rotarCajas(){
  pushUndo();
  const days=monthDays();
  S.rot=S.rot||{};
  days.forEach(d=>delete S.rot[key(d)]);
  const last={},uso={};
  plan(new Date(Y,M,0, 12,0,0)).rows.forEach(r=>{if(r.st==='W'&&r.caja)last[r.p.id]=[+r.caja]});
  const todas=Array.from({length:S.cajas},(_,i)=>i+1);
  const acC=(S.cajasAC||[]).filter(c=>c>=1&&c<=S.cajas);
  const prio=(S.prio||[]).filter(c=>c>=1&&c<=S.cajas);
  const rk=c=>{const i=prio.indexOf(c);return i<0?prio.length:i};
  const cand0=p=>{
    const ok=(p.cajasOk||[]).filter(c=>c>=1&&c<=S.cajas);
    if(ok.length)return ok;
    if(p.isAC&&acC.length)return acC;
    const res=todas.filter(c=>!acC.includes(c));
    return res.length?res:todas;
  };
  const permit=(c,p)=>!(S.restr||[]).some(g=>+g.caja===c&&!(g.personas||[]).includes(p.id));
  const cand=p=>{const r=cand0(p).filter(c=>permit(c,p));return r.length?r:cand0(p)};

  const progSheet = sheet(`
    <h3>Rotando Cajas Automáticamente</h3>
    <p style="color:var(--muted); font-size:14px; margin:0 0 12px 0;">Distribuyendo cajas de forma equitativa y respetando reglas correlativas...</p>
    <div style="background:var(--line); border-radius:8px; height:12px; overflow:hidden; margin-bottom:12px;">
      <div id="rot-bar" style="background:var(--accent); width:0%; height:100%; transition:width 0.08s ease;"></div>
    </div>
    <div id="rot-lbl" style="font-size:13.5px; font-weight:600; text-align:center; color:var(--ink);">Iniciando optimización...</div>
  `);

  const total = days.length;
  for(let iDay=0; iDay<total; iDay++){
    const d = days[iDay];
    const pct = Math.round(((iDay+1)/total)*100);
    const bEl = document.getElementById('rot-bar');
    const lEl = document.getElementById('rot-lbl');
    if(bEl) bEl.style.width = pct + '%';
    if(lEl) lEl.textContent = `Optimizando día ${d.getDate()} de ${MESES[M]} (${iDay+1}/${total})...`;

    await new Promise(r => setTimeout(r, 6));

    const k=key(d),dw=dow(d);
    const rows=plan(d).rows;
    const mov=rows.filter(r=>r.st==='W'&&!r.mod&&!r.auto&&(!r.x||r.x.pat)&&(!r.pat||r.patRot)&&(r.sh==='M'||r.sh==='T')&&r.p.shift!=='V'&&!r.p.noRota);
    if(mov.length){
      const fixed=[];
      rows.forEach(r=>{
        if(r.st!=='W'||!r.sh||r.auto)return;
        if(!mov.includes(r))fixed.push({c:+r.caja||1,sh:r.sh,a:mins(r.ini),b:mins(r.fin)});
        if(r.x)fixed.push({c:+r.x.caja||1,sh:r.x.sh,a:mins(r.x.ini),b:mins(r.x.fin)});
      });
      const ev=asg=>{
        let sc=0;
        const it=fixed.slice();
        mov.forEach(r=>it.push({c:asg[r.p.id],sh:r.sh,a:mins(r.ini),b:mins(r.fin)}));
        for(let i=0;i<it.length;i++)for(let j=i+1;j<it.length;j++)
          if(it[i].c===it[j].c&&it[i].sh===it[j].sh&&it[i].a<it[j].b&&it[j].a<it[i].b)sc+=400;
        const occ={m:new Set(),t:new Set()};
        it.forEach(x=>(x.sh==='M'?occ.m:occ.t).add(x.c));
        (S.reglas||[]).forEach(g=>{const f=reglaFallas(g,occ,dw);sc+=1000*(g.modo==='alguna'?(f.length?1:0):f.length)});
        mov.forEach(r=>{
          const h=last[r.p.id]||[],c=asg[r.p.id];
          if(h[0]===c)sc+=30;if(h[1]===c)sc+=12;if(h[2]===c)sc+=6;
          if(!(r.p.isAC&&acC.includes(c)))sc+=12*rk(c);
          sc+=2*((uso[r.p.id]||{})[c]||0);
        });
        return sc;
      };
      let best=null,bestSc=Infinity;
      for(let t=0;t<35&&bestSc>0;t++){
        const asg={};
        mov.forEach(r=>{const c=cand(r.p);asg[r.p.id]=c[Math.floor(Math.random()*c.length)]});
        let sc=ev(asg);
        for(let n=0;n<130;n++){
          const a=mov[Math.floor(Math.random()*mov.length)];
          const asg2={...asg};
          if(Math.random()<.5){
            const c=cand(a.p);asg2[a.p.id]=c[Math.floor(Math.random()*c.length)];
          }else{
            const b=mov[Math.floor(Math.random()*mov.length)];
            if(a===b||!cand(a.p).includes(asg[b.p.id])||!cand(b.p).includes(asg[a.p.id]))continue;
            asg2[a.p.id]=asg[b.p.id];asg2[b.p.id]=asg[a.p.id];
          }
          const sc2=ev(asg2);
          if(sc2<=sc){Object.assign(asg,asg2);sc=sc2}
        }
        if(sc<bestSc){bestSc=sc;best={...asg}}
      }
      S.rot[k]={};
      mov.forEach(r=>{
        const id=r.p.id,c=best[id];
        S.rot[k][id]=c;
        last[id]=[c,...(last[id]||[])].slice(0,3);
        uso[id]=uso[id]||{};uso[id][c]=(uso[id][c]||0)+1;
      });
    }
  }

  close();
  commit();
  const n=reglasFallidas().length;
  toast(n?`Cajas rotadas. ${n} día${n>1?'s':''} con reglas sin cumplir (ver aviso naranja)`:'Cajas rotadas y reglas optimizadas');
}

const fmtMins=m=>{const h=Math.floor(m/60),n=m%60;return n?`${h}h ${n}m`:`${h}h`};
function lowHourRows(d){
  const{rows}=plan(d);const dw=dow(d);const out=[];
  rows.forEach(r=>{
    if(r.st!=='W'||!r.ini||!r.fin)return;
    const p=r.p;
    if(!(p.dailyHours>0)||p.franco===dw)return;
    let worked=diffMins(r.ini,r.fin);
    if(r.x)worked+=diffMins(r.x.ini,r.x.fin);
    const need=Math.round(p.dailyHours*60);
    if(worked<need)out.push({d,p,worked,need,falta:need-worked});
  });
  return out;
}
function lowHours(){const out=[];monthDays().forEach(d=>out.push(...lowHourRows(d)));return out}
function problems(){
  const out=[];
  monthDays().forEach(d=>{
    const{c}=plan(d);const dw=dow(d),w=S.week[dw];
    ['M','T'].forEach(sh=>{if(w[sh]&&c[sh]<w['n'+sh])out.push({d,sh,falta:w['n'+sh]-c[sh]})});
  });
  return out;
}

/* ---------- guardado y backup con sincronización en la nube ---------- */
function clean(o){return JSON.parse(JSON.stringify(o))}
function save(){
  lastLocal=Date.now();
  setSync('Guardando…');
  try{localStorage.setItem('turnos-amistad',JSON.stringify(S))}catch(e){}
  
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    if(turnosRef){
      turnosRef.set(clean(S))
        .then(()=>setSync('Sincronizado ☁️'))
        .catch(err=>{
          console.warn('Cloud save error:',err);
          setSync('Guardado local 📱');
        });
    } else {
      setSync('Guardado local 📱');
    }
  },350);
}
function setSync(t){const el=document.getElementById('sync');if(el)el.textContent=t}
function loadLocal(){
  try{
    const t=localStorage.getItem('turnos-amistad');
    if(t){
      const parsed = JSON.parse(t);
      if (parsed.need !== undefined) {
        parsed.week = DOWS.map(()=>({M:true, T:true, hM:[...parsed.hours.M], hT:[...parsed.hours.T], nM:parsed.need, nT:parsed.need}));
        parsed.week[6] = {M:true, T:false, hM:['09:00','14:00'], hT:['13:30','21:30'], nM:parsed.need, nT:0};
        delete parsed.need; delete parsed.hours;
      }
      S={...S,...parsed};
      S.feriados = S.feriados || {};
      S.ov = S.ov || {};
      S.rot = S.rot || {};
      S.reglas = S.reglas || [];
      S.alt = S.alt || [];
      S.restr = S.restr || [];
    }
  }catch(e){}
}
function commit(skipSaveHistory = false){
  save();
  updateUndoUI();
  render();
}

function exportBackupJSON(){
  try{
    const dataStr="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S,null,2));
    const dl=document.createElement('a');
    const dt=new Date().toISOString().slice(0,10);
    dl.setAttribute("href",dataStr);
    dl.setAttribute("download",`Turnos_La_Amistad_Backup_${dt}.json`);
    document.body.appendChild(dl);
    dl.click();
    dl.remove();
    toast('Copia de seguridad descargada (JSON)');
  }catch(e){
    toast('Error al exportar respaldo');
  }
}

function importBackupJSON(){
  const inp=document.createElement('input');
  inp.type='file';
  inp.accept='.json,application/json';
  inp.onchange=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const parsed=JSON.parse(ev.target.result);
        if(!parsed||!Array.isArray(parsed.people)){
          alert('El archivo no tiene el formato de personal válido de Turnos La Amistad.');
          return;
        }
        pushUndo();
        S={...S,...parsed};
        S.feriados=S.feriados||{};
        S.notas=S.notas||{};
        commit();
        toast('¡Copia de seguridad restaurada correctamente!');
      }catch(err){
        alert('Error al leer el archivo JSON: '+err.message);
      }
    };
    r.readAsText(file);
  };
  inp.click();
}

  h+=`<div class="cal">${DOWS.map(x=>`<div class="dow">${x}</div>`).join('')}`;
  const first=new Date(Y,M,1, 12,0,0);const start=new Date(first);start.setDate(1-dow(first));
  const last=days[days.length-1];const end=new Date(last);end.setDate(last.getDate()+(6-dow(last)));
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const inM=d.getMonth()===M;
    if(!inM){h+=`<div class="day out" aria-hidden="true"><span class="n">${d.getDate()}</span></div>`;continue}
    const{c}=plan(d);const k=key(d);const dw=dow(d),w=S.week[dw];
    const bad=(w.M && c.M<w.nM) || (w.T && c.T<w.nT);const mod=!!S.ov[k];const low=lowHourRows(d).length>0;
    const isFer=!!(S.feriados&&S.feriados[k]); const hasNote=!!(S.notas&&S.notas[k]);
    h+=`<button class="day${bad?' bad':''}${low?' lowh':''}${isFer?' feriado-day':''}${k===selKey?' sel':''}" data-k="${k}" aria-label="${dayLabel(d)}"><span class="n">${d.getDate()}${mod?'<i title="Con cambios"></i>':''}</span>
      ${isFer?`<span class="cov feriado-tag" title="Feriado: ${esc(S.feriados[k].name)}">★ ${esc(S.feriados[k].name)}</span>`:''}
      ${w.M?`<span class="cov M${c.M<w.nM?' short':''}">M ${c.M}</span>`:''}
      ${w.T?`<span class="cov T${c.T<w.nT?' short':''}">T ${c.T}</span>`:''}
      ${low?'<span class="cov lowh-tag" title="Alguien con menos horas de las debidas">⏱</span>':''}
    </button>`;
  }
  h+=`</div><div id="detail"></div>`;
  main.innerHTML=h;
  main.querySelectorAll('.day[data-k]').forEach(b=>b.onclick=()=>{selKey=b.dataset.k;renderCal();document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'})});
  main.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{const p=pr[+b.dataset.pr];selKey=key(p.d);renderCal();openProps(p.d,p.sh)});
  main.querySelectorAll('[data-lh]').forEach(b=>b.onclick=()=>{const x=lh[+b.dataset.lh];selKey=key(x.d);renderCal();document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'})});
  main.querySelectorAll('[data-rgx]').forEach(b=>b.onclick=()=>{const x=rf[+b.dataset.rgx];selKey=key(x.d);renderCal();document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'})});
  main.querySelectorAll('[data-mcx]').forEach(b=>b.onclick=()=>{const x=mc[+b.dataset.mcx];selKey=key(x.d);renderCal();document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'})});
  document.getElementById('rot').onclick=rotarCajas;
  document.getElementById('xls').onclick=exportXlsx;
  const rb=document.getElementById('reset');
  rb.onclick=()=>{
    if(rb.dataset.arm){
      pushUndo();
      days.forEach(d=>{delete S.ov[key(d)];if(S.rot)delete S.rot[key(d)]});
      commit();
      toast(`${MESES[M]} regenerado desde la configuración del personal`);
      return;
    }
    rb.dataset.arm=1;rb.classList.add('danger');rb.textContent='Tocá de nuevo: borra los cambios del mes';
    setTimeout(()=>{if(rb.isConnected){delete rb.dataset.arm;rb.classList.remove('danger');rb.textContent='Regenerar mes'}},4000);
  };
  renderDetail();
}

function buildDayTableHTML(d, isExport = false) {
  const{rows,c}=plan(d);const dw=dow(d),w=S.week[dw];
  const k=key(d);
  const isFer=!!(S.feriados&&S.feriados[k]);
  
  const hasShift=(sh,cj)=>rows.some(r=>r.st==='W'&&((r.sh===sh&&(+r.caja||1)===cj)||(r.x&&r.x.sh===sh&&(+r.x.caja||1)===cj)));
  const cell=(sh,cj)=>{
    const items=[];
    rows.forEach(r=>{
      if(r.st==='W'&&r.sh===sh&&(+r.caja||1)===cj){
        const isExt = isExtra(r, w, dw, isFer);
        items.push({r,isExtSlot:false,ini:r.ini,fin:r.fin,note:r.auto&&r.cubre?`Cubre a ${r.cubre}`:'', extra: isExt});
      }
      if(r.st==='W'&&r.x&&r.x.sh===sh&&(+r.x.caja||1)===cj)items.push({r,isExtSlot:true,ini:r.x.ini,fin:r.x.fin,note:r.x.pat?((S.cajasAC||[]).includes(+r.x.caja||1)?'AT. CLIENTE':''):'Extiende', extra: !r.x.pat});
    });
    
    let htmlContent = items.map(it=>{
      let notes = [];
      if(it.r.ac) notes.push("AT. CLIENTE");
      if(it.note) notes.push(it.note);
      const noteTxt = notes.join(" • ");
      return `<div class="turno-block ${it.extra?'extra':''} ${it.r.ac?'ac-block':''}" data-p="${it.r.p.id}" data-is-ext="${it.isExtSlot?'1':'0'}" ${isExport?'style="pointer-events:none"':'draggable="true"'}>
            <b>${esc(it.r.p.name)}</b>
            <span class="time">${hh(it.ini)} A ${hh(it.fin)}</span>
            ${noteTxt?`<small style="${it.r.ac?'color:#4338ca;font-weight:700;':''}">${esc(noteTxt)}</small>`:''}
        </div>`;
    }).join('');
    
    if(!isExport) {
      if(items.length === 0) {
          htmlContent = `<div style="display:flex; justify-content:center; align-items:center; min-height:48px;"><div class="add-circle-btn" data-add-sh="${sh}" data-add-cj="${cj}">+</div></div>`;
      } else {
          htmlContent = `<div class="td-relative">${htmlContent}<div class="add-circle-btn add-btn-corner" data-add-sh="${sh}" data-add-cj="${cj}">+</div></div>`;
      }
    }
    return htmlContent;
  };
  
  let rowsH='';
  for(let cj=1;cj<=S.cajas;cj++){
    const cellM = w.M ? cell('M', cj) : '';
    const cellT = w.T ? cell('T', cj) : '';
    const isCorrelativa = !!(w.M && w.T && hasShift('M',cj) && hasShift('T',cj));
    
    const tdM = w.M ? `<td data-cell-sh="M" data-cell-cj="${cj}">${cellM}</td>` : `<td></td>`;
    const tdT = w.T ? `<td data-cell-sh="T" data-cell-cj="${cj}">${cellT}</td>` : `<td></td>`;
    
    rowsH+=`<tr class="${isCorrelativa ? 'correlativa' : ''}"><td class="c">CAJA ${cj}</td>${tdM}${tdT}</tr>`;
  }
  
  const fr=rows.filter(r=>r.st==='F'),au=rows.filter(r=>r.st==='A');
  const vac=rows.filter(r=>r.st==='VAC'),med=rows.filter(r=>r.st==='MED'),est=rows.filter(r=>r.st==='EST');
  const acRows=rows.filter(r=>r.st==='W'&&r.ac);
  
  let notesHtml = `<div class="export-footer">`;
  const userNote = (S.notas && S.notas[k]) ? S.notas[k] : '';
  if(userNote) notesHtml += `<div class="footer-row"><span class="footer-label" style="background:#dbeafe;color:#1e40af">📝 NOTA</span> <span class="footer-text" style="color:#0f172a;font-weight:700;">${esc(userNote)}</span></div>`;

  if(isFer) notesHtml += `<div class="footer-row"><span class="footer-label" style="background:#fef08a;color:#854d0e">★ FERIADO</span> <span class="footer-text" style="color:#b45309">${esc(S.feriados[k].name)}</span></div>`;
  if(fr.length) notesHtml += `<div class="footer-row"><span class="footer-label">FRANCO</span> <span class="footer-text">${fr.map(r=>esc(r.p.name)).join(', ')}</span></div>`;
  if(au.length) notesHtml += `<div class="footer-row"><span class="footer-label" style="background:#fecaca;color:#991b1b">AUSENTE</span> <span class="footer-text">${au.map(r=>esc(r.p.name)).join(', ')}</span></div>`;
  if(vac.length) notesHtml += `<div class="footer-row"><span class="footer-label" style="background:#bae6fd;color:#0369a1">VACACIONES</span> <span class="footer-text">${vac.map(r=>esc(r.p.name)).join(', ')}</span></div>`;
  if(med.length) notesHtml += `<div class="footer-row"><span class="footer-label" style="background:#fed7aa;color:#c2410c">LIC. MÉDICA</span> <span class="footer-text">${med.map(r=>esc(r.p.name)).join(', ')}</span></div>`;
  if(est.length) notesHtml += `<div class="footer-row"><span class="footer-label" style="background:#fef08a;color:#854d0e">DÍA ESTUDIO</span> <span class="footer-text">${est.map(r=>esc(r.p.name)).join(', ')}</span></div>`;
  
  const acTails=rows.filter(r=>r.st==='W'&&r.x&&r.x.pat&&(S.cajasAC||[]).includes(+r.x.caja||1));
  if(acRows.length||acTails.length) {
      notesHtml += `<div class="footer-row"><span class="footer-label" style="background:#e0e7ff;color:#3730a3">ATENCIÓN AL CLIENTE</span> <span class="footer-text">${[...acRows.map(r=>`<b>${esc(r.p.name)}</b> (Caja ${r.caja} - ${hh(r.ini)} A ${hh(r.fin)})`),...acTails.map(r=>`<b>${esc(r.p.name)}</b> (Caja ${r.x.caja} - ${hh(r.x.ini)} A ${hh(r.x.fin)})`)].join(', ')}</span></div>`;
  }

  if(w.M && c.M<w.nM) notesHtml += `<div class="footer-row" style="color:#b91c1c; font-weight:700; margin-top:8px;">⚠ FALTAN ${w.nM-c.M} EN MAÑANA</div>`;
  if(w.T && c.T<w.nT) notesHtml += `<div class="footer-row" style="color:#b91c1c; font-weight:700; margin-top:8px;">⚠ FALTAN ${w.nT-c.T} EN TARDE</div>`;
  if(!isExport){
    const lw=lowHourRows(d);
    if(lw.length) notesHtml += `<div class="footer-row no-export" style="color:#b45309; font-weight:700; margin-top:8px;">⏱ MENOS HORAS: ${lw.map(x=>`${esc(x.p.name)} (${fmtMins(x.worked)} de ${fmtMins(x.need)})`).join(', ')}</div>`;
  }
  notesHtml += `</div>`;

  let titleHeader = `${DOWL[dw]} ${d.getDate()} DE ${MESES[d.getMonth()]}`;
  if(isFer) titleHeader += ` • ★ ${esc(S.feriados[k].name)}`;

  return `<div class="export-card" id="table-export-${key(d)}">
    <div class="export-header">${titleHeader}</div>
    <table class="export-table">
      <thead>
        <tr><th>Cajas</th><th>Turno Mañana</th><th>Turno Tarde</th></tr>
      </thead>
      <tbody>${rowsH}</tbody>
    </table>
    ${notesHtml}
  </div>`;
}


function copyWhatsAppDay(k) {
  const d = fromKey(k);
  const { rows } = plan(d);
  const dw = dow(d), w = S.week[dw];
  const isFer = !!(S.feriados && S.feriados[k]);
  
  let txt = "📅 *TURNOS LA AMISTAD - " + DOWL[dw] + " " + d.getDate() + " DE " + MESES[d.getMonth()].toUpperCase() + "*\n";
  if (isFer) txt += "🌟 *FERIADO: " + S.feriados[k].name.toUpperCase() + "*\n";
  if (S.notas && S.notas[k]) txt += "📝 *NOTA*: " + S.notas[k] + "\n";
  txt += "\n";

  if (w.M) {
    txt += "☀️ *TURNO MAÑANA*\n";
    for (let cj = 1; cj <= S.cajas; cj++) {
      const items = rows.filter(r => r.st === 'W' && r.sh === 'M' && (+r.caja || 1) === cj);
      if (items.length) {
        items.forEach(it => {
          txt += "• *Caja " + cj + "*: " + it.p.name + " (" + hh(it.ini) + " a " + hh(it.fin) + ")" + (it.ac ? " [At. Cliente]" : "") + "\n";
        });
      }
    }
    txt += "\n";
  }

  if (w.T) {
    txt += "🌙 *TURNO TARDE*\n";
    for (let cj = 1; cj <= S.cajas; cj++) {
      const items = rows.filter(r => r.st === 'W' && r.sh === 'T' && (+r.caja || 1) === cj);
      if (items.length) {
        items.forEach(it => {
          txt += "• *Caja " + cj + "*: " + it.p.name + " (" + hh(it.ini) + " a " + hh(it.fin) + ")" + (it.ac ? " [At. Cliente]" : "") + "\n";
        });
      }
    }
    txt += "\n";
  }

  const fr = rows.filter(r => r.st === 'F');
  if (fr.length) txt += "🏖️ *FRANCO*: " + fr.map(r => r.p.name).join(', ') + "\n";

  const au = rows.filter(r => r.st === 'A');
  if (au.length) txt += "🚫 *AUSENTE*: " + au.map(r => r.p.name).join(', ') + "\n";

  const vac = rows.filter(r => r.st === 'VAC');
  if (vac.length) txt += "✈️ *VACACIONES*: " + vac.map(r => r.p.name).join(', ') + "\n";

  const med = rows.filter(r => r.st === 'MED');
  if (med.length) txt += "🩺 *MÉDICA*: " + med.map(r => r.p.name).join(', ') + "\n";

  navigator.clipboard.writeText(txt).then(() => {
    toast('¡Mensaje para WhatsApp copiado al portapapeles!');
  }).catch(() => {
    toast('Copiado al portapapeles');
  });
}

function renderImgExport(){
  const days = monthDays();
  let todayStr = key(today);
  
  let firstDay = days.find(d => key(d) >= todayStr) || days[0];
  let endDay = new Date(firstDay);
  endDay.setDate(endDay.getDate() + 2);
  if(endDay.getMonth() !== M) endDay = days[days.length-1];

  main.innerHTML = `
    <div class="settings" style="display: flex; gap: 15px; align-items: flex-end; padding: 18px; margin-bottom: 24px; flex-wrap:wrap;">
        <label style="flex:1; min-width:140px;"><b>Desde:</b><input type="date" id="img-start" value="${key(firstDay)}" style="margin-top:6px;"></label>
        <label style="flex:1; min-width:140px;"><b>Hasta:</b><input type="date" id="img-end" value="${key(endDay)}" style="margin-top:6px;"></label>
        <button class="btn primary" onclick="downloadRangeImage()" style="margin-bottom: 2px;">Descargar Selección</button>
    </div>
    
    <div id="range-preview" style="display: flex; flex-wrap: wrap; gap: 24px; background: #f1f5f9; padding: 24px; border-radius: 12px; justify-content: center; border: 1px solid #cbd5e1;">
    </div>
  `;
  
  const updatePreview = () => {
      const startStr = document.getElementById('img-start').value;
      const endStr = document.getElementById('img-end').value;
      const preview = document.getElementById('range-preview');
      preview.innerHTML = '';
      
      let d = fromKey(startStr);
      let endD = fromKey(endStr);
      
      if (isNaN(d) || isNaN(endD) || d > endD) {
          preview.innerHTML = '<p style="color: var(--muted); font-weight:600;">Seleccioná un rango de fechas válido</p>';
          return;
      }
      
      let diffTime = Math.abs(endD - d);
      let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      if(diffDays > 7) {
          preview.innerHTML = '<p style="color: var(--danger); font-weight:600;">Máximo 7 días para exportar en una sola imagen</p>';
          return;
      }
      
      let html = '';
      let current = new Date(d);
      while(current <= endD) {
          html += `<div style="flex: 1 1 400px; min-width: 360px;">${buildDayTableHTML(current, true)}</div>`;
          current.setDate(current.getDate() + 1);
      }
      preview.innerHTML = html;
  };
  
  document.getElementById('img-start').onchange = updatePreview;
  document.getElementById('img-end').onchange = updatePreview;
  updatePreview();
}

function renderBox(){
    const days = monthDays();
    let firstDay = days[0];
    let endDay = days[days.length-1];
    
    main.innerHTML = `
        <div class="settings" style="display: flex; gap: 15px; align-items: flex-end; padding: 18px; margin-bottom: 20px; flex-wrap:wrap;">
            <label style="flex:1; min-width:140px;"><b>Desde:</b><input type="date" id="box-start" value="${key(firstDay)}" style="margin-top:6px;"></label>
            <label style="flex:1; min-width:140px;"><b>Hasta:</b><input type="date" id="box-end" value="${key(endDay)}" style="margin-top:6px;"></label>
        </div>
        <div id="box-table-container"></div>
    `;

    const updateBox = () => {
        const startStr = document.getElementById('box-start').value;
        const endStr = document.getElementById('box-end').value;
        const container = document.getElementById('box-table-container');
        
        let d = fromKey(startStr);
        let endD = fromKey(endStr);
        
        if (isNaN(d) || isNaN(endD) || d > endD) {
            container.innerHTML = '<p style="color: var(--muted); font-weight:600; text-align:center;">Seleccioná un rango de fechas válido</p>';
            return;
        }

        const stats = S.people.map(p => {
            const counts = {};
            for(let i=1; i<=S.cajas; i++) counts[i] = 0;
            return { p: p, total: 0, counts };
        });
        
        let current = new Date(d);
        while(current <= endD) {
            const {rows} = plan(current);
            stats.forEach(st => {
                const r = rows.find(x => x.p.id === st.p.id);
                if(r && r.st === 'W') {
                    st.total++;
                    if (r.caja && r.caja >= 1 && r.caja <= S.cajas) {
                        st.counts[r.caja] = (st.counts[r.caja] || 0) + 1;
                    }
                }
            });
            current.setDate(current.getDate() + 1);
        }

        let ths = '';
        for(let i=1; i<=S.cajas; i++) ths += `<th style="text-align:center; padding: 12px 6px;">Caja ${i}</th>`;
        ths += `<th style="text-align:center; padding: 12px 6px;">Total Días</th>`;

        let tbody = '';
        stats.sort((a,b) => b.total - a.total).forEach(st => {
            let tds = '';
            for(let i=1; i<=S.cajas; i++) {
                const v = st.counts[i];
                tds += `<td style="text-align:center; padding:10px 6px; ${v > 0 ? 'font-weight:700; color:var(--accent)' : 'color:var(--muted); opacity:0.5'}">${v}</td>`;
            }
            tds += `<td style="text-align:center; padding:10px 6px; font-weight:bold; font-size: 15px; background: var(--bg);">${st.total}</td>`;
            
            tbody += `
                <tr style="border-bottom:1px solid var(--line);">
                    <td style="padding:10px 12px;"><b>${esc(st.p.name)}</b> ${st.p.isAC?'<small style="color:#6366f1; font-weight:700;">(AC)</small>':''}</td>
                    ${tds}
                </tr>
            `;
        });

        container.innerHTML = `
            <div style="overflow-x:auto; border-radius:12px; border:1px solid var(--line); background:var(--surface);">
            <table style="width:100%; border-collapse:collapse; font-size:14px; min-width: 600px;">
                <thead>
                    <tr style="background:var(--bg); border-bottom:2px solid var(--line); font-family:var(--display); text-transform:uppercase; font-size:13px; color:var(--muted);">
                        <th style="text-align:left; padding:12px;">Personal</th>
                        ${ths}
                    </tr>
                </thead>
                <tbody>
                    ${tbody}
                </tbody>
            </table>
            </div>
        `;
    };

    document.getElementById('box-start').onchange = updateBox;
    document.getElementById('box-end').onchange = updateBox;
    updateBox();
}

async function downloadSingleImage(k) {
    const el = document.getElementById(`table-export-${k}`);
    if(!el) return;
    toast('Generando imagen...');
    try {
        const canvas = await html2canvas(el, {scale: 2, backgroundColor: '#ffffff', scrollY: -window.scrollY, ignoreElements: n => n.classList && n.classList.contains('no-export')});
        const link = document.createElement('a');
        link.download = `Turno_${k}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    } catch(e) {
        toast('Error al generar la imagen');
    }
}

async function downloadRangeImage() {
    const preview = document.getElementById('range-preview');
    if(!preview || preview.children.length === 0) return;
    toast('Generando imagen del cronograma...');
    
    const origStyle = preview.style.cssText;
    preview.style.width = preview.children.length === 1 ? '550px' : '1100px';
    preview.style.background = '#ffffff';
    preview.style.padding = '30px';
    
    try {
        const canvas = await html2canvas(preview, {scale: 2, backgroundColor: '#ffffff', scrollY: -window.scrollY});
        const link = document.createElement('a');
        link.download = `Cronograma_Turnos.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    } catch(e) {
        toast('Error al generar la imagen');
        console.error(e);
    } finally {
        preview.style.cssText = origStyle;
    }
}

function renderDay(){
  let h = `<div class="actions"><button class="btn primary" onclick="commit();toast('Configuración guardada')">Guardar cambios</button></div>`;
  h += `<div class="cards">${DOWS.map((n,i)=>{
    const w=S.week[i];
    return `<div class="pc" data-dw="${i}">
      <h2 class="full" style="margin:0;font-size:18px;color:var(--accent)">${DOWL[i]}</h2>
      
      <div class="h3" style="display:flex;align-items:center;gap:6px;font-weight:bold"><input type="checkbox" data-f="M" ${w.M?'checked':''}> Habilitar Mañana</div>
      ${w.M?`<label>Entrada<input type="time" data-f="hM0" value="${w.hM[0]}"></label><label>Salida<input type="time" data-f="hM1" value="${w.hM[1]}"></label><label>Personal req.<input type="number" min="1" max="10" data-f="nM" value="${w.nM}"></label>`:'<div class="h3"></div>'}
      
      <div class="h3" style="display:flex;align-items:center;gap:6px;font-weight:bold;margin-top:8px"><input type="checkbox" data-f="T" ${w.T?'checked':''}> Habilitar Tarde</div>
      ${w.T?`<label style="margin-top:8px">Entrada<input type="time" data-f="hT0" value="${w.hT[0]}"></label><label style="margin-top:8px">Salida<input type="time" data-f="hT1" value="${w.hT[1]}"></label><label style="margin-top:8px">Personal req.<input type="number" min="1" max="10" data-f="nT" value="${w.nT}"></label>`:'<div class="h3"></div>'}
    </div>`;
  }).join('')}</div>`;
  main.innerHTML = h;
  
  main.querySelectorAll('.pc input').forEach(inp=>{
    inp.onchange=e=>{
      pushUndo();
      const dw = +inp.closest('.pc').dataset.dw;
      const f = inp.dataset.f;
      const w = S.week[dw];
      if (f==='M'||f==='T') w[f] = inp.checked;
      else if (f==='nM'||f==='nT') w[f] = +inp.value;
      else if (f==='hM0') w.hM[0] = inp.value;
      else if (f==='hM1') w.hM[1] = inp.value;
      else if (f==='hT0') w.hT[0] = inp.value;
      else if (f==='hT1') w.hT[1] = inp.value;
      
      if(f==='M'||f==='T') renderDay(); else save();
    }
  });
}

      <label>Caja<select data-rs="caja">${Array.from({length:S.cajas},(_,i)=>opt(i+1,i+1,g.caja)).join('')}</select></label>
      <div class="full"><span class="hint">Pueden estar en esta caja</span><div class="cjchk" style="margin-top:4px">${S.people.filter(x=>x.shift!=='V').map(x=>`<label><input type="checkbox" data-rp="${x.id}" ${(g.personas||[]).includes(x.id)?'checked':''}>${esc(x.name)}</label>`).join('')}</div></div>
      <div class="full"><button class="btn small danger" data-rsdel="${g.id}">Quitar</button></div>
    </div>`).join('')}
    <div><button class="btn small" id="add-rs">Agregar caja exclusiva</button></div></div>`;
  h+=`<div class="dist"><strong>Alternancia semanal entre personas</strong>
    <span class="hint">Se turnan las cajas semana a semana (por ejemplo, una persona en la 6 y otra en Atención al Cliente, y a la semana siguiente al revés). Esos días quedan fijos para la rotación.</span>
    ${(S.alt||[]).map(g=>`<div class="rg" data-agid="${g.id}">
      <div class="full"><span class="hint">Personas (la primera marcada arranca en la primera caja)</span><div class="cjchk" style="margin-top:4px">${S.people.filter(x=>x.shift!=='V').map(x=>`<label><input type="checkbox" data-ap="${x.id}" ${(g.personas||[]).includes(x.id)?'checked':''}>${esc(x.name)}</label>`).join('')}</div></div>
      <label>Cajas en orden (ej: 6,7)<input data-af="cajas" value="${(g.cajas||[]).join(',')}"></label>

      <div class="full cjchk">${DOWS.map((n,i)=>`<label><input type="checkbox" data-ad="${i}" ${(g.dias||[]).includes(i)?'checked':''}>${n}</label>`).join('')}</div>
      <span class="hint full">${(g.personas||[]).length?'Orden: '+g.personas.map(id=>{const x=S.people.find(q=>q.id===id);return x?esc(x.name):'?'}).join(' → ')+'. ':''}${altPreview(g)}</span>
      <div class="full"><button class="btn small danger" data-adel="${g.id}">Quitar alternancia</button></div>
    </div>`).join('')}
    <div><button class="btn small" id="add-alt">Agregar alternancia</button></div></div>`;

  // Barra de búsqueda y filtros de personal
  h+=`<div class="settings" style="margin-top:14px;">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
      <h3 style="margin:0; font-size:16px;">Personal (${S.people.length})</h3>
      <div style="display:flex; gap:6px;">
        <button class="btn small" id="btn-exp-all">Desplegar todos</button>
        <button class="btn small" id="btn-col-all">Plegar todos</button>
      </div>
    </div>
    <div style="display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;">
      <input type="text" id="per-search" placeholder="🔍 Buscar por nombre..." value="${esc(perSearch)}" style="flex:1; min-width:160px;">
      <div class="chips" style="align-items:center;">
        <button class="chip ${perFilter==='ALL'?'active':''}" data-pfilter="ALL">Todos (${S.people.length})</button>

        <button class="chip ${perFilter==='T'?'active':''}" data-pfilter="T">Tarde (${S.people.filter(p=>p.shift==='T').length})</button>

  const filteredPeople = S.people.filter(p => {

    if (perSearch && !p.name.toLowerCase().includes(perSearch.toLowerCase())) return false;
    return true;
  });

  h+=`<div class="cards" id="per-cards-list">${filteredPeople.map(p=>`<div class="pc" data-id="${p.id}" id="pc-${p.id}">
      <div class="pc-head">
        <div class="pc-head-left">
          <b>${esc(p.name)}</b>
          <span>${SHN[p.shift]} • ${p.shift==='V'?'Volante':`Caja base ${p.caja||1}`} • Franco ${p.franco>=0?DOWS[p.franco]:'Sin día fijo'}${p.isAC?' • (At. Cliente)':''}</span>
        </div>
        <span class="pc-toggle">▼</span>
      </div>
      <div class="pc-body">
        <label class="full">Nombre<input id="n-${p.id}" data-f="name" value="${esc(p.name)}"></label>
        <label class="h3">Turno fijo<select id="s-${p.id}" data-f="shift">${opt('M','Mañana',p.shift)}${opt('T','Tarde',p.shift)}${opt('V','Volante (cubre francos)',p.shift)}</select></label>
        <label class="h3">Franco fijo<select id="fr-${p.id}" data-f="franco">${opt(-1,'Sin día fijo',p.franco)}${DOWS.map((n,i)=>opt(i,n,p.franco)).join('')}</select></label>
        ${p.shift==='V'?`<p class="hint full">Va solo al turno al que le falte gente, en la caja y horario de quien está de franco.</p>`:`
        <label class="h2">Caja base<select id="c-${p.id}" data-f="caja">${Array.from({length:S.cajas},(_,i)=>opt(i+1,i+1,p.caja||1)).join('')}</select></label>
        <label class="h2">Entrada<input type="time" id="i-${p.id}" data-f="ini" value="${p.ini}"></label>
        <label class="h2">Salida<input type="time" id="o-${p.id}" data-f="fin" value="${p.fin}"></label>`}
        <label class="h3" style="margin-top:4px;">Horas diarias mínimas<input type="number" min="1" max="16" step="0.5" id="dh-${p.id}" data-f="dailyHours" value="${p.dailyHours||''}" placeholder="Ej: 7"></label>
        <label class="h3" style="margin-top:4px;">Horas semanales base<input type="number" min="1" max="80" step="0.5" id="th-${p.id}" data-f="targetHours" value="${p.targetHours||''}" placeholder="Ej: 48"></label>
        <label class="h3" style="margin-top:4px;">Horario Domingo<input type="text" id="dom-${p.id}" data-f="domSchedule" value="${p.domSchedule||''}" placeholder="Ej: 09:00-14:00"></label>
        <div class="full" style="display:flex; align-items:center; gap:8px; margin-top:4px;">
          <label style="display:flex; flex-direction:row; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer;">
            <input type="checkbox" data-f="isAC" ${p.isAC?'checked':''} style="width:18px; height:18px;"> Es de Atención al Cliente (rol habitual)
          </label>
        </div>
        ${p.shift==='V'?'':`<div class="full"><span class="hint" style="display:block;margin:4px 0;font-size:12px;color:var(--muted);font-weight:600;">Cajas permitidas para rotar (sin marcar = todas)</span><div class="cjchk">${Array.from({length:S.cajas},(_,i)=>`<label><input type="checkbox" data-cj="${i+1}" ${(p.cajasOk||[]).includes(i+1)?'checked':''}>${i+1}</label>`).join('')}</div></div>
        <div class="full" style="display:flex; align-items:center; gap:8px; margin-top:4px;">
          <label style="display:flex; flex-direction:row; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer;">
            <input type="checkbox" data-f="noRota" ${p.noRota?'checked':''} style="width:18px; height:18px;"> Caja fija (no rota)
          </label>
        </div>`}
        ${p.shift==='V'?'':`<div class="full"><span class="hint" style="display:block;margin:6px 0 0;font-size:12px;color:var(--muted);font-weight:600;">Excepciones por día de la semana (distinta caja u horario, hasta 2 tramos)</span>
          ${(p.excep||[]).map(e=>`<div class="ex" data-exid="${e.id}">
            <div class="full cjchk">${DOWS.map((n,i)=>`<label><input type="checkbox" data-ed="${i}" ${(e.dias||[]).includes(i)?'checked':''}>${n}</label>`).join('')}</div>
            <span class="hint full">Tramo 1</span>
            <label class="h2">Caja<select data-ef="t1.caja">${(()=>{const c1=(e.t1&&e.t1.caja!=null)?e.t1.caja:1;return opt(0,'Rota',c1)+Array.from({length:S.cajas},(_,i)=>opt(i+1,i+1,c1)).join('')})()}</select></label>
            <label class="h2">Entrada<input type="time" data-ef="t1.ini" value="${(e.t1||{}).ini||''}"></label>
            <label class="h2">Salida<input type="time" data-ef="t1.fin" value="${(e.t1||{}).fin||''}"></label>
            <span class="hint full">Tramo 2 (opcional, dejá vacío si no hay)</span>
            <label class="h2">Caja<select data-ef="t2.caja">${Array.from({length:S.cajas},(_,i)=>opt(i+1,i+1,(e.t2||{}).caja||1)).join('')}</select></label>
            <label class="h2">Entrada<input type="time" data-ef="t2.ini" value="${(e.t2||{}).ini||''}"></label>
            <label class="h2">Salida<input type="time" data-ef="t2.fin" value="${(e.t2||{}).fin||''}"></label>

          <div style="margin-top:6px"><button class="btn small" data-exadd="${p.id}">Agregar excepción</button></div></div>`}

      </div>
    </div>`).join('')}</div>

  main.innerHTML=h;

  // Interacción de acordeones
  main.querySelectorAll('.pc-head').forEach(head => {

      head.closest('.pc').classList.toggle('collapsed');
    };
  });
  document.getElementById('btn-exp-all').onclick = () => {
    main.querySelectorAll('.pc').forEach(c => c.classList.remove('collapsed'));
  };
  document.getElementById('btn-col-all').onclick = () => {
    main.querySelectorAll('.pc').forEach(c => c.classList.add('collapsed'));
  };

  // Buscador y filtros

  if(pSearch){
    pSearch.oninput = (e) => {
      perSearch = e.target.value;
      const cards = main.querySelectorAll('.pc[data-id]');
      cards.forEach(card => {
        const id = card.dataset.id;
        const p = S.people.find(x => x.id === id);
        if(!p) return;
        const matchSearch = !perSearch || p.name.toLowerCase().includes(perSearch.toLowerCase());
        const matchFilter = perFilter === 'ALL' || p.shift === perFilter;
        card.style.display = (matchSearch && matchFilter) ? '' : 'none';
      });
    };
  }

  main.querySelectorAll('[data-pfilter]').forEach(btn => {
    btn.onclick = () => {
      perFilter = btn.dataset.pfilter;
      renderPer();
    };
  });
  
  const nums=v=>[...new Set(v.split(/[^0-9]+/).map(Number).filter(n=>n>=1&&n<=15))];
  document.getElementById('s-prio').onchange=e=>{pushUndo();S.prio=nums(e.target.value);commit()};
  document.getElementById('s-cac').onchange=e=>{pushUndo();S.cajasAC=nums(e.target.value);commit()};
  document.getElementById('s-cajas').onchange=e=>{pushUndo();const v=parseInt(e.target.value);if(v>0){S.cajas=v;commit()}};
  
  main.querySelectorAll('.pc [data-f]').forEach(inp=>inp.onchange=()=>{
    pushUndo();
    const p=S.people.find(x=>x.id===inp.closest('.pc').dataset.id);const f=inp.dataset.f;
    let v = inp.type==='checkbox' ? inp.checked : inp.value;
    if(f==='franco'||f==='caja'||f==='targetHours'||f==='dailyHours')v=(v===''?null:(!isNaN(v)?+v:v));
    p[f]=v;
    if(f==='shift'&&v!=='V'){p.caja=p.caja||1;p.ini=p.ini||'08:00';p.fin=p.fin||'16:00'}
    if(f==='name'){save();return}
    commit();
  });
  main.querySelectorAll('.pc [data-cj]').forEach(cb=>cb.onchange=()=>{
    pushUndo();
    const p=S.people.find(x=>x.id===cb.closest('.pc').dataset.id);
    p.cajasOk=[...cb.closest('.cjchk').querySelectorAll('[data-cj]')].filter(x=>x.checked).map(x=>+x.dataset.cj);
    if(!p.cajasOk.length)delete p.cajasOk;
    commit();
  });
  const gRs=el=>S.restr.find(x=>x.id===el.closest('.rg').dataset.rsid);
  main.querySelectorAll('.rg [data-rs]').forEach(sel=>sel.onchange=()=>{pushUndo();gRs(sel).caja=+sel.value;commit()});
  main.querySelectorAll('.rg [data-rp]').forEach(cb=>cb.onchange=()=>{
    pushUndo();
    const g=gRs(cb),id=cb.dataset.rp;
    g.personas=cb.checked?[...(g.personas||[]).filter(x=>x!==id),id]:(g.personas||[]).filter(x=>x!==id);
    commit();
  });
  main.querySelectorAll('[data-rsdel]').forEach(b=>b.onclick=()=>{
    if(!b.dataset.arm){b.dataset.arm=1;b.textContent='¿Seguro? Tocá de nuevo';return}
    pushUndo();
    S.restr=S.restr.filter(x=>x.id!==b.dataset.rsdel);commit();
  });
  document.getElementById('add-rs').onclick=()=>{pushUndo();S.restr=S.restr||[];S.restr.push({id:uid(),caja:6,personas:[]});commit()};
  const gAlt=el=>S.alt.find(x=>x.id===el.closest('.rg').dataset.agid);
  main.querySelectorAll('.rg [data-ap]').forEach(cb=>cb.onchange=()=>{
    pushUndo();
    const g=gAlt(cb),id=cb.dataset.ap;
    g.personas=cb.checked?[...(g.personas||[]).filter(x=>x!==id),id]:(g.personas||[]).filter(x=>x!==id);
    commit();
  });
  main.querySelectorAll('.rg [data-af]').forEach(inp=>inp.onchange=()=>{
    pushUndo();
    const g=gAlt(inp);
    if(inp.dataset.af==='cajas')g.cajas=inp.value.split(/[^0-9]+/).map(Number).filter(n=>n>=1&&n<=15);
    else g.desde=inp.value;
    commit();
  });
  main.querySelectorAll('.rg [data-ad]').forEach(cb=>cb.onchange=()=>{
    pushUndo();
    const g=gAlt(cb);
    g.dias=[...cb.closest('.rg').querySelectorAll('[data-ad]')].filter(x=>x.checked).map(x=>+x.dataset.ad);
    commit();
  });
  main.querySelectorAll('[data-adel]').forEach(b=>b.onclick=()=>{
    if(!b.dataset.arm){b.dataset.arm=1;b.textContent='¿Seguro? Tocá de nuevo';return}
    pushUndo();
    S.alt=S.alt.filter(x=>x.id!==b.dataset.adel);commit();
  });
  document.getElementById('add-alt').onclick=()=>{pushUndo();S.alt=S.alt||[];S.alt.push({id:uid(),personas:[],cajas:[6,7],dias:[3],desde:key(today)});commit()};
  main.querySelectorAll('.pc [data-ef]').forEach(inp=>inp.onchange=()=>{
    pushUndo();
    const p=S.people.find(x=>x.id===inp.closest('.pc').dataset.id);
    const e=p.excep.find(x=>x.id===inp.closest('.ex').dataset.exid);
    const[t,f]=inp.dataset.ef.split('.');
    e[t]=e[t]||{caja:1,ini:'',fin:''};
    e[t][f]=f==='caja'?+inp.value:inp.value;
    commit();
  });
  main.querySelectorAll('.pc [data-ed]').forEach(cb=>cb.onchange=()=>{
    pushUndo();
    const p=S.people.find(x=>x.id===cb.closest('.pc').dataset.id);
    const e=p.excep.find(x=>x.id===cb.closest('.ex').dataset.exid);
    e.dias=[...cb.closest('.ex').querySelectorAll('[data-ed]')].filter(x=>x.checked).map(x=>+x.dataset.ed);
    commit();
  });
  main.querySelectorAll('[data-exadd]').forEach(b=>b.onclick=()=>{
    pushUndo();
    const p=S.people.find(x=>x.id===b.dataset.exadd);
    p.excep=p.excep||[];
    p.excep.push({id:uid(),dias:[],t1:{caja:p.caja||1,ini:p.ini||'',fin:p.fin||''},t2:{caja:p.caja||1,ini:'',fin:''}});
    commit();
  });
  main.querySelectorAll('[data-exdel]').forEach(b=>b.onclick=()=>{
    if(!b.dataset.arm){b.dataset.arm=1;b.textContent='¿Seguro? Tocá de nuevo';return}
    pushUndo();
    const p=S.people.find(x=>x.id===b.closest('.pc').dataset.id);
    p.excep=p.excep.filter(x=>x.id!==b.dataset.exdel);
    if(!p.excep.length)delete p.excep;
    commit();
  });
  main.querySelectorAll('.rg [data-rf]').forEach(inp=>inp.onchange=()=>{
    pushUndo();
    const g=S.reglas.find(x=>x.id===inp.closest('.rg').dataset.rgid);
    if(inp.dataset.rf==='cajas')g.cajas=inp.value.split(/[^0-9]+/).map(Number).filter(n=>n>=1&&n<=15);
    else g.modo=inp.value;
    commit();
  });
  main.querySelectorAll('.rg [data-rd]').forEach(cb=>cb.onchange=()=>{
    pushUndo();
    const g=S.reglas.find(x=>x.id===cb.closest('.rg').dataset.rgid);
    g.dias=[...cb.closest('.rg').querySelectorAll('[data-rd]')].filter(x=>x.checked).map(x=>+x.dataset.rd);
    commit();
  });
  main.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>{
    if(!b.dataset.arm){b.dataset.arm=1;b.textContent='¿Seguro? Tocá de nuevo';return}
    pushUndo();
    S.reglas=S.reglas.filter(x=>x.id!==b.dataset.rdel);commit();
  });
  document.getElementById('add-rg').onclick=()=>{pushUndo();S.reglas=S.reglas||[];S.reglas.push({id:uid(),cajas:[1],modo:'alguna',dias:[0,1,2,3,4,5,6]});commit()};
  
  // Borrado de personal con limpieza en cascada
  main.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!b.dataset.arm){b.dataset.arm=1;b.textContent='¿Seguro? Tocá de nuevo';return}
    pushUndo();
    const id=b.dataset.del;
    S.people=S.people.filter(p=>p.id!==id);
    Object.values(S.ov).forEach(o=>delete o[id]);
    if(S.rot) Object.values(S.rot).forEach(r=>delete r[id]);
    (S.restr||[]).forEach(g=>{ g.personas = (g.personas||[]).filter(x=>x!==id); });
    (S.alt||[]).forEach(g=>{ g.personas = (g.personas||[]).filter(x=>x!==id); });
    commit();
  });
  document.getElementById('add').onclick=()=>{
    pushUndo();
    S.people.push({id:uid(),name:'Nueva persona',shift:'M',franco:-1,caja:1,ini:'07:00',fin:'15:00',isAC:false});
    commit();
    const last=main.querySelector('.pc:last-child input');if(last){last.focus();last.select()}
  };
}

/* ---------- hojas y modales ---------- */
const layer=document.getElementById('layer');
function sheet(html){layer.innerHTML=`<div class="sheet" id="sh"><div class="in" role="dialog" aria-modal="true">${html}</div></div>`;
  const s=document.getElementById('sh');s.onclick=e=>{if(e.target===s)close()};return s}
function close(){layer.innerHTML=''}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}

function openAddPersonToCell(d, targetCj, targetSh) {
  const dw = dow(d), w = S.week[dw];
  const { rows } = plan(d);
  const defaultIni = targetSh === 'M' ? w.hM[0] : w.hT[0];
  const defaultFin = targetSh === 'M' ? w.hM[1] : w.hT[1];

  let peopleOptions = S.people.map(p => {
    const r = rows.find(x => x.p.id === p.id);
    let statusTxt = '';
    if (r) {
      if (r.st === 'F') statusTxt = ' (De franco)';
      else if (r.st === 'A') statusTxt = ' (Ausente)';
      else if (r.st === 'VAC') statusTxt = ' (Vacaciones)';
      else if (r.st === 'MED') statusTxt = ' (Médica)';
      else if (r.st === 'EST') statusTxt = ' (Estudio)';
      else if (r.st === 'W') {
        statusTxt = ` (Trabaja: ${SHN[r.sh]} Caja ${r.caja}${r.x ? (r.x.pat ? ' + 2º tramo' : ' + Ext.') : ''})`;
      }
    }
    return `<option value="${p.id}">${esc(p.name)}${statusTxt}</option>`;
  }).join('');

  const s = sheet(`
    <h3>Asignar Cajero a Caja ${targetCj} (${SHN[targetSh]})</h3>
    <p style="margin:0 0 10px 0; font-size:13px; color:var(--muted);">Seleccioná el cajero. Si ya trabaja en otro turno o caja, podés agregarlo como horario cortado / extensión.</p>
    <div class="grid2">
      <label class="full">Cajero<select id="add-pid">${peopleOptions}</select></label>
      <label>Hora Entrada<input type="time" id="add-ini" value="${defaultIni}"></label>
      <label>Hora Salida<input type="time" id="add-fin" value="${defaultFin}"></label>
    </div>
    <div style="margin-top:10px; background:var(--bg); padding:10px; border-radius:8px; border:1px solid var(--line);">
      <label style="display:flex; flex-direction:row; align-items:center; gap:8px; font-size:13.5px; font-weight:600; cursor:pointer;">
        <input type="checkbox" id="add-ac" style="width:18px; height:18px;"> Función de Atención al Cliente
      </label>
    </div>
    <div class="grid2" style="margin-top:14px;">
      <button class="btn primary" id="add-save">Asignar / Agregar</button>
      <button class="btn" id="add-cancel">Cancelar</button>
    </div>
  `);

  const pidSelect = s.querySelector('#add-pid');
  const iniInput = s.querySelector('#add-ini');
  const finInput = s.querySelector('#add-fin');
  const acInput = s.querySelector('#add-ac');

  const updateDefaultsForPerson = () => {
    const pid = pidSelect.value;
    const p = S.people.find(x => x.id === pid);
    if (!p) return;
    acInput.checked = !!p.isAC;
  };

  pidSelect.onchange = updateDefaultsForPerson;
  updateDefaultsForPerson();

  s.querySelector('#add-cancel').onclick = close;
  s.querySelector('#add-save').onclick = () => {
    pushUndo();
    const pid = pidSelect.value;
    const ini = iniInput.value;
    const fin = finInput.value;
    const isAC = acInput.checked;

    const r = rows.find(x => x.p.id === pid);

    if (!r || r.st !== 'W') {
      setOv(d, pid, { st: 'W', sh: targetSh, caja: targetCj, ini, fin, ac: isAC });
    } else {
      const newX = { sh: targetSh, caja: targetCj, ini, fin };
      setOv(d, pid, { ...snap(r), x: newX, ac: isAC });
    }
    commit();
    close();
    toast('Cajero asignado correctamente');
  };
}

function setupDayTableInteractions(d, el) {
  // Click en botón redondo de agregar (+)
  el.querySelectorAll('[data-add-sh]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const sh = btn.dataset.addSh;
      const cj = +btn.dataset.addCj;
      openAddPersonToCell(d, cj, sh);
    };
  });

  let draggedPid = null;
  let draggedIsExt = false;
  let touchedEl = null;

  const handleDropToCell = (targetSh, targetCj) => {
    if (!draggedPid) return;
    const { rows } = plan(d);
    const r = rows.find(x => x.p.id === draggedPid);
    if (!r) return;

    // Verificar si la caja de destino ya tiene otro cajero asignado
    const occupant = rows.find(x => x.st === 'W' && x.p.id !== draggedPid && (
      (x.sh === targetSh && (+x.caja || 1) === targetCj) ||
      (x.x && x.x.sh === targetSh && (+x.x.caja || 1) === targetCj)
    ));

    if (occupant) {
      sheet(`
        <h3>Caja ${targetCj} (${SHN[targetSh]}) ya está ocupada</h3>
        <p style="margin:0 0 14px 0; font-size:14px; color:var(--muted);">
          <b>${esc(occupant.p.name)}</b> ya está en esta caja. ¿Qué deseas hacer con <b>${esc(r.p.name)}</b>?
        </p>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <button class="btn primary" id="drop-swap">↔ Intercambiar posiciones (${esc(r.p.name)} ↔ ${esc(occupant.p.name)})</button>
          <button class="btn" id="drop-coexist">👥 Asignar ambos a Caja ${targetCj} (Superponer / refuerzo)</button>
          <button class="btn danger" id="drop-cancel">Cancelar</button>
        </div>
      `);

      document.getElementById('drop-swap').onclick = () => {
        pushUndo();
        const rOrigCaja = +r.caja || 1;
        const rOrigSh = r.sh;
        if (draggedIsExt && r.x) {
          setOv(d, draggedPid, { ...snap(r), x: { ...r.x, sh: targetSh, caja: targetCj } }, true);
        } else {
          setOv(d, draggedPid, { ...snap(r), sh: targetSh, caja: targetCj }, true);
        }
        setOv(d, occupant.p.id, { ...snap(occupant), sh: rOrigSh, caja: rOrigCaja }, true);
        commit(); close();
        toast(`Puestos intercambiados: ${r.p.name} ↔ ${occupant.p.name}`);
      };

      document.getElementById('drop-coexist').onclick = () => {
        pushUndo();
        if (draggedIsExt && r.x) {
          setOv(d, draggedPid, { ...snap(r), x: { ...r.x, sh: targetSh, caja: targetCj } }, true);
        } else {
          setOv(d, draggedPid, { ...snap(r), sh: targetSh, caja: targetCj }, true);
        }
        commit(); close();
        toast(`Asignado a Caja ${targetCj} junto a ${occupant.p.name}`);
      };

      document.getElementById('drop-cancel').onclick = close;
      return;
    }

    pushUndo();
    if (draggedIsExt && r.x) {
      const updatedX = { ...r.x, sh: targetSh, caja: targetCj };
      setOv(d, draggedPid, { ...snap(r), x: updatedX });
    } else {
      if (r.sh === targetSh) {
        setOv(d, draggedPid, { ...snap(r), caja: targetCj });
      } else {
        setOv(d, draggedPid, { ...snap(r), sh: targetSh, caja: targetCj });
      }
    }
    commit();
    toast(`Movido a Caja ${targetCj} (${SHN[targetSh]})`);
  };

  el.querySelectorAll('.turno-block[draggable="true"]').forEach(block => {
    block.ondragstart = (e) => {
      draggedPid = block.dataset.p;
      draggedIsExt = block.dataset.isExt === '1';
      block.style.opacity = '0.4';
      e.dataTransfer.setData('text/plain', draggedPid);
    };

    block.ondragend = () => {
      block.style.opacity = '1';
      draggedPid = null;
    };

    let touchStartX = 0;
    let touchStartY = 0;
    let isDragging = false;
    let longPressTimer = null;

    block.ontouchstart = (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isDragging = false;
      draggedPid = block.dataset.p;
      draggedIsExt = block.dataset.isExt === '1';
      touchedEl = block;

      longPressTimer = setTimeout(() => {
        isDragging = true;
        block.classList.add('dragging-touch');
        if (navigator.vibrate) navigator.vibrate(40);
      }, 400);
    };

    block.ontouchmove = (e) => {
      if (!draggedPid) return;
      const touch = e.touches[0];
      const deltaX = Math.abs(touch.clientX - touchStartX);
      const deltaY = Math.abs(touch.clientY - touchStartY);

      if (!isDragging) {
        if (deltaX > 8 || deltaY > 8) {
          clearTimeout(longPressTimer);
        }
        return;
      }

      e.preventDefault();
      const targetUnderTouch = document.elementFromPoint(touch.clientX, touch.clientY);
      el.querySelectorAll('td[data-cell-sh]').forEach(td => td.classList.remove('drop-target'));
      if (targetUnderTouch) {
        const tdCell = targetUnderTouch.closest('td[data-cell-sh]');
        if (tdCell) tdCell.classList.add('drop-target');
      }
    };

    block.ontouchend = (e) => {
      clearTimeout(longPressTimer);
      if (!draggedPid) return;
      block.classList.remove('dragging-touch');
      if (isDragging) {
          e.preventDefault();
          const touch = e.changedTouches[0];
          const targetUnderTouch = document.elementFromPoint(touch.clientX, touch.clientY);
          el.querySelectorAll('td[data-cell-sh]').forEach(td => td.classList.remove('drop-target'));

          if (targetUnderTouch) {
            const tdCell = targetUnderTouch.closest('td[data-cell-sh]');
            if (tdCell) {
              const targetSh = tdCell.dataset.cellSh;
              const targetCj = +tdCell.dataset.cellCj;
              handleDropToCell(targetSh, targetCj);
            }
          }
      }
      draggedPid = null;
      touchedEl = null;
      isDragging = false;
    };

    block.ontouchcancel = () => {
      clearTimeout(longPressTimer);
      block.classList.remove('dragging-touch');
      draggedPid = null;
      touchedEl = null;
      isDragging = false;
    };
  });

  el.querySelectorAll('td[data-cell-sh]').forEach(td => {
    td.ondragover = (e) => {
      e.preventDefault();
      td.classList.add('drop-target');
    };
    td.ondragleave = () => {
      td.classList.remove('drop-target');
    };
    td.ondrop = (e) => {
      e.preventDefault();
      td.classList.remove('drop-target');
      const targetSh = td.dataset.cellSh;
      const targetCj = +td.dataset.cellCj;
      handleDropToCell(targetSh, targetCj);
    };
  });
}

    <div class="grid2">
      <button class="btn danger" id="q-out">Sacar este día</button>

    </div>
    <div class="grid2">
      <label>Estado<select id="f-st">
        ${opt('W','Trabaja',r.st)}
        ${opt('F','Franco',r.st)}
        ${opt('A','Ausente',r.st)}
        ${opt('VAC','Vacaciones',r.st)}
        ${opt('MED','Licencia Médica',r.st)}
        ${opt('EST','Día de Estudio',r.st)}
      </select></label>
      <label>Turno<select id="f-sh">${w.M?opt('M','Mañana',r.sh||p.shift):''}${w.T?opt('T','Tarde',r.sh||p.shift):''}</select></label>

      <label>Salida<input type="time" id="f-fin" value="${r.fin||(w.M?w.hM[1]:w.hT[1])}"></label>
    </div>
    <div style="margin-top:6px; background:var(--bg); padding:10px; border-radius:8px; border:1px solid var(--line);">
      <label style="display:flex; flex-direction:row; align-items:center; gap:8px; font-size:13.5px; font-weight:600; cursor:pointer;">
        <input type="checkbox" id="f-ac" ${r.ac?'checked':''} style="width:18px; height:18px;"> Cumple función de Atención al Cliente este día
      </label>
    </div>
    ${r.x?`<div class="prop"><div class="k">${r.x.pat?'Segundo tramo':'Extensión'}</div><p>Cubre caja ${r.x.caja} en turno ${SHN[r.x.sh].toLowerCase()} de ${hh(r.x.ini)} a ${hh(r.x.fin)}.</p><button class="btn small danger" id="f-delx">Quitar extensión</button></div>`:''}
    <div class="prop">
      <div class="k">Intercambiar con asociado</div>
      <div style="display:flex; gap:8px;">
        <select id="swap-sel" style="flex:1; font-size:14px; padding:6px;">
          <option value="">Seleccionar persona...</option>
          ${rows.filter(x => x.p.id !== pid).map(x => {
              let desc = x.st === 'F' ? 'Franco' : (x.st === 'A' ? 'Ausente' : (x.st === 'VAC' ? 'Vacaciones' : `${SHN[x.sh]} ${hh(x.ini)} a ${hh(x.fin)}`));
              return `<option value="${x.p.id}">${esc(x.p.name)} (${desc})</option>`;
          }).join('')}
        </select>
        <button class="btn primary small" id="swap-btn" disabled>Cambiar</button>
      </div>
    </div>
    <div class="grid2" style="margin-top:4px"><button class="btn primary" id="f-ok">Guardar cambios</button>${r.mod?'<button class="btn" id="f-rst">Quitar cambios</button>':'<button class="btn" id="f-cancel">Cancelar</button>'}</div>`);
  
  const after=(prevSh)=>{commit();const{c}=plan(d);const sh=['M','T'].find(x=>w[x]&&c[x]<w['n'+x]);
    if(sh)openProps(d,sh,`Sacaste a ${p.name}.`);else{close();toast(prevSh?'Listo, el turno sigue cubierto':'Guardado')}};
  
  s.querySelector('#q-out').onclick=()=>{pushUndo();setOv(d,pid,{st:'A'});after(r.sh)};
  s.querySelector('#q-fr').onclick=()=>{
    pushUndo();
    if(r.st==='F'){
      let sh=p.shift==='V'?(w.M?'M':'T'):p.shift; if(!w[sh]) sh = w.M?'M':'T';
      setOv(d,pid,{st:'W',sh,caja:p.caja||null,ini:p.ini||w['h'+sh][0],fin:p.fin||w['h'+sh][1]});
      commit();close();toast(`${p.name} trabaja el ${dayLabel(d)}`)
    }
    else{setOv(d,pid,{st:'F'});after(r.sh)}

      if(!tgtId) return;
      pushUndo();
      const tr = rows.find(x => x.p.id === tgtId);
      setOv(d, pid, snap(tr), true);
