      toast(`Turnos intercambiados: ${p.name} ↔ ${tr.p.name}`);
      const n = plan(d).c;
      const sh = ['M','T'].find(x=>w[x]&&n[x]<w['n'+x]);
      if(sh) openProps(d, sh, 'Revisá la cobertura.');
  };

  s.querySelector('#f-ok').onclick=()=>{
    pushUndo();
    const st=s.querySelector('#f-st').value;
    const ac=s.querySelector('#f-ac').checked;
    if(st!=='W')setOv(d,pid,{st,ac});
    else{const v={st,sh:s.querySelector('#f-sh').value,caja:+s.querySelector('#f-cj').value||1,ini:s.querySelector('#f-ini').value,fin:s.querySelector('#f-fin').value,ac};if(r.x)v.x=r.x;setOv(d,pid,v)}
    after(r.st==='W'&&st!=='W'?r.sh:null);
  };
  const rst=s.querySelector('#f-rst');if(rst)rst.onclick=()=>{pushUndo();setOv(d,pid,null);commit();close();toast('Vuelve a lo planificado')};
  const cn=s.querySelector('#f-cancel');if(cn)cn.onclick=close;
  const dx=s.querySelector('#f-delx');if(dx)dx.onclick=()=>{pushUndo();const v=snap(r);delete v.x;setOv(d,pid,v);after(null)};
}

function openProps(d,sh,lead){
  const{c}=plan(d);const dw=dow(d),w=S.week[dw];
  if(!w[sh] || c[sh]>=w['n'+sh]){close();toast(`Turno ${SHN[sh].toLowerCase()} cubierto`);return}
  const ps=proposals(d,sh);
  const s=sheet(`<h3>${lead?esc(lead)+' ':''}Falta${w['n'+sh]-c[sh]>1?'n':''} ${w['n'+sh]-c[sh]} en turno ${SHN[sh].toLowerCase()} · ${dayLabel(d)}</h3>
    ${ps.length?ps.map((p,i)=>`<div class="prop"><div class="k${p.warn?' w':''}">${esc(p.kind)}</div><strong>${esc(p.title)}</strong><p>${esc(p.det)}</p><button class="btn primary small" data-i="${i}">Aplicar</button></div>`).join('')
      :'<p class="hint">No encontré a nadie disponible. Podés cargar el cambio a mano tocando un nombre.</p>'}
    <button class="btn" id="p-close">Dejarlo así por ahora</button>`);
  s.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    pushUndo();
    ps[+b.dataset.i].apply();commit();const n=plan(d).c;
    const o=['M','T'].find(x=>w[x]&&n[x]<w['n'+x]);if(o)openProps(d,o);else{close();toast('Listo, el día quedó cubierto')}
  });
  s.querySelector('#p-close').onclick=close;
}

/* ---------- Exportación Excel Profesional ---------- */

function exportWeekXlsx(mon) {
  if (typeof XLSX === 'undefined') { toast('No se pudo cargar el generador de Excel.'); return; }
  const B = {style:'thin', color:{rgb:'9A97A8'}};
  const border = {top:B, bottom:B, left:B, right:B};
  const st = (o={}) => ({
    font: {name:'Arial', sz:11, bold:!!o.b, color:{rgb:o.red?'C00000':'000000'}},
    alignment: {horizontal:o.left?'left':'center', vertical:'center', wrapText:true},
    border: o.nb?{}:border,
    ...(o.fill?{fill:{patternType:'solid',fgColor:{rgb:o.fill}}}:{})
  });
  const LAV='E4E1EE', GRN='CFE3C4', HDR='D3D0DE';
  const wb = XLSX.utils.book_new();

  const weekDays = Array.from({length: 7}, (_, i) => {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    return d;
  });

  const ws = {}; const merges = []; let maxR = 0;
  const H = S.cajas + 10;
  const put = (w_s, r, c, v, s) => { w_s[XLSX.utils.encode_cell({r, c})] = {v, t: typeof v === 'number' ? 'n' : 's', s}; };

  weekDays.forEach((d, i) => {
    const R = Math.floor(i / 2) * (H + 1), C = (i % 2) * 4;
    const {rows} = plan(d);
    const dw = dow(d), w = S.week[dw];
    const kDay = key(d);
    const isFer = !!(S.feriados && S.feriados[kDay]);
    let titleDay = `${DOWL[dw]} ${d.getDate()}`;
    if (isFer) titleDay += ` (FERIADO: ${S.feriados[kDay].name.toUpperCase()})`;

    put(ws, R, C, titleDay, st({b:true, fill:isFer?'FEF08A':LAV}));
    put(ws, R, C+1, '', st({fill:isFer?'FEF08A':LAV}));
    put(ws, R, C+2, '', st({fill:isFer?'FEF08A':LAV}));
    merges.push({s:{r:R, c:C}, e:{r:R, c:C+2}});

    ['CAJAS', 'TURNO MAÑANA', 'TURNO TARDE'].forEach((t, j) => put(ws, R+1, C+j, t, st({b:true, fill:HDR})));
    for (let cj = 1; cj <= S.cajas; cj++) {
      put(ws, R+1+cj, C, `CAJA ${cj}`, st({b:true, fill:HDR}));
      ['M', 'T'].forEach((sh, j) => {
        const it = []; let red = false;
        rows.forEach(r => {
          if (r.st === 'W' && r.sh === sh && +r.caja === cj) {
            it.push(`${r.p.name.toUpperCase()} ${hh(r.ini)} A ${hh(r.fin)}`);
            red = red || r.mod;
          }
          if (r.st === 'W' && r.x && r.x.sh === sh && +r.x.caja === cj) {
            it.push(`${r.p.name.toUpperCase()} ${hh(r.x.ini)} A ${hh(r.x.fin)}`);
            if (!r.x.pat) red = true;
          }
        });
        if (w[sh]) put(ws, R+1+cj, C+1+j, it.join(' / '), st({b:false, red, fill:it.length ? GRN : LAV}));
        else put(ws, R+1+cj, C+1+j, '-', st({fill:LAV}));
      });
    }

    const notes = [];
    if (isFer) notes.push(`★ FERIADO: ${S.feriados[kDay].name.toUpperCase()}`);
    if (S.notas && S.notas[kDay]) notes.push(`NOTA: ${S.notas[kDay].toUpperCase()}`);
    const fr = rows.filter(r => r.st === 'F').map(r => r.p.name.toUpperCase());
    if (fr.length) notes.push('FRANCO: ' + fr.join(', '));
    const au = rows.filter(r => r.st === 'A').map(r => r.p.name.toUpperCase());
    if (au.length) notes.push('AUSENTE: ' + au.join(', '));
    const vac = rows.filter(r => r.st === 'VAC').map(r => r.p.name.toUpperCase());
    if (vac.length) notes.push('VACACIONES: ' + vac.join(', '));
    const med = rows.filter(r => r.st === 'MED').map(r => r.p.name.toUpperCase());
    if (med.length) notes.push('LIC. MÉDICA: ' + med.join(', '));
    const est = rows.filter(r => r.st === 'EST').map(r => r.p.name.toUpperCase());
    if (est.length) notes.push('DÍA ESTUDIO: ' + est.join(', '));
    rows.filter(r => r.st === 'W' && r.ac).forEach(r => notes.push(`${r.p.name.toUpperCase()} ${SHN[r.sh].toUpperCase()} ${hh(r.ini)} A ${hh(r.fin)} (CAJA ${r.caja} - AT. CLIENTE)`));
    rows.filter(r => r.st === 'W' && r.x && r.x.pat && (S.cajasAC || []).includes(+r.x.caja)).forEach(r => notes.push(`${r.p.name.toUpperCase()} ${hh(r.x.ini)} A ${hh(r.x.fin)} (CAJA ${r.x.caja} - AT. CLIENTE)`));

    notes.forEach((nt, j) => {
      put(ws, R+1+S.cajas+1+j, C, nt, st({left:true, nb:true, b:true}));
      merges.push({s:{r:R+1+S.cajas+1+j, c:C}, e:{r:R+1+S.cajas+1+j, c:C+2}});
    });
    if (R+1+S.cajas+1+notes.length > maxR) maxR = R+1+S.cajas+1+notes.length;
  });

  ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:maxR, c:7}});
  ws['!merges'] = merges;
  ws['!cols'] = [{wch:10}, {wch:26}, {wch:26}, {wch:3}, {wch:10}, {wch:26}, {wch:26}];
  const sun = weekDays[6];
  const sheetName = `Semana_${mon.getDate()}_al_${sun.getDate()}`;
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, `Cronograma_${sheetName}_${MESES[mon.getMonth()]}.xlsx`);
  toast('¡Excel semanal descargado con éxito!');
}

function exportXlsx(){
  if(typeof XLSX==='undefined'){toast('No se pudo cargar el generador de Excel. Recargá la página.');return}
  const B={style:'thin',color:{rgb:'9A97A8'}};const border={top:B,bottom:B,left:B,right:B};
  const st=(o={})=>({font:{name:'Arial',sz:11,bold:!!o.b,color:{rgb:o.red?'C00000':'000000'}},alignment:{horizontal:o.left?'left':'center',vertical:'center',wrapText:true},border:o.nb?{}:border,...(o.fill?{fill:{patternType:'solid',fgColor:{rgb:o.fill}}}:{})});
  const LAV='E4E1EE',GRN='CFE3C4',HDR='D3D0DE',BEI='F3E9CF';
  const wb=XLSX.utils.book_new();
  const days=monthDays();

  // Hoja 1: Resumen por persona
  const rs={};const put=(ws,r,c,v,s)=>{ws[XLSX.utils.encode_cell({r,c})]={v,t:typeof v==='number'?'n':'s',s}};
  put(rs,0,0,`TURNOS ${MESES[M].toUpperCase()} ${Y}`,st({b:true,nb:true,left:true}));
  put(rs,1,0,'PERSONA',st({b:true,fill:HDR}));
  days.forEach((d,i)=>put(rs,1,i+1,`${DOWS[dow(d)].toUpperCase()} ${d.getDate()}`,st({b:true,fill:HDR})));
  const plans=days.map(plan);
  S.people.forEach((p,j)=>{
    put(rs,j+2,0,p.name.toUpperCase(),st({b:true,fill:LAV,left:true}));
    plans.forEach((pl,i)=>{const r=pl.rows.find(x=>x.p.id===p.id);let v,f;
      if(r.st==='F'){v='FRANCO';f=LAV}
      else if(r.st==='A'){v='AUSENTE';f='F6D5D0'}
      else if(r.st==='VAC'){v='VACACIONES';f='E0F2FE'}
      else if(r.st==='MED'){v='MÉDICA';f='FEE2E2'}
      else if(r.st==='EST'){v='ESTUDIO';f='FEF3C7'}
      else{v=`${r.sh==='M'?'M':'T'}${r.caja?' C'+r.caja:''}
${hh(r.ini)}-${hh(r.fin)}${r.x?`
+${hh(r.x.ini)}-${hh(r.x.fin)}`:''}`;f=r.sh==='M'?BEI:GRN}
      put(rs,j+2,i+1,v,st({fill:f,red:r.mod}))});
  });
  ['M','T'].forEach((sh,k)=>{const rr=S.people.length+2+k;put(rs,rr,0,`EN ${SHN[sh].toUpperCase()}`,st({b:true,fill:HDR}));
    plans.forEach((pl,i)=>{const w=S.week[dow(days[i])]; if(w[sh]) put(rs,rr,i+1,pl.c[sh],st({b:true,red:pl.c[sh]<w['n'+sh]})); else put(rs,rr,i+1,'-',st({fill:LAV})); })});
  rs['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:S.people.length+3,c:days.length}});
  rs['!cols']=[{wch:14},...days.map(()=>({wch:11}))];
  rs['!rows']=[{hpt:20},{hpt:20},...S.people.map(()=>({hpt:44}))];
  rs['!merges']=[{s:{r:0,c:0},e:{r:0,c:6}}];
  XLSX.utils.book_append_sheet(wb,rs,'Resumen');

  // Hojas Semanales
  const weeks=[];days.forEach(d=>{if(!weeks.length||dow(d)===0)weeks.push([]);weeks[weeks.length-1].push(d)});
  const H=S.cajas+10; // Espacio holgado para todas las notas
  weeks.forEach((wk,wi)=>{
    const ws={};const merges=[];let maxR=0;
    wk.forEach((d,i)=>{
      const R=Math.floor(i/2)*(H+1),C=(i%2)*4;const{rows}=plan(d);const dw=dow(d),w=S.week[dw];
      const kDay=key(d);
      const isFer=!!(S.feriados&&S.feriados[kDay]);
      let titleDay = `${DOWL[dw]} ${d.getDate()}`;
      if(isFer) titleDay += ` (FERIADO: ${S.feriados[kDay].name.toUpperCase()})`;

      put(ws,R,C,titleDay,st({b:true,fill:isFer?'FEF08A':LAV}));put(ws,R,C+1,'',st({fill:isFer?'FEF08A':LAV}));put(ws,R,C+2,'',st({fill:isFer?'FEF08A':LAV}));
      merges.push({s:{r:R,c:C},e:{r:R,c:C+2}});
      ['CAJAS','TURNO MAÑANA','TURNO TARDE'].forEach((t,j)=>put(ws,R+1,C+j,t,st({b:true,fill:HDR})));
      for(let cj=1;cj<=S.cajas;cj++){
        put(ws,R+1+cj,C,`CAJA ${cj}`,st({b:true,fill:HDR}));
        ['M','T'].forEach((sh,j)=>{
          const it=[];let red=false;
          rows.forEach(r=>{if(r.st==='W'&&r.sh===sh&&+r.caja===cj){it.push(`${r.p.name.toUpperCase()} ${hh(r.ini)} A ${hh(r.fin)}`);red=red||r.mod}
            if(r.st==='W'&&r.x&&r.x.sh===sh&&+r.x.caja===cj){it.push(`${r.p.name.toUpperCase()} ${hh(r.x.ini)} A ${hh(r.x.fin)}`);if(!r.x.pat)red=true}});
          if(w[sh]) put(ws,R+1+cj,C+1+j,it.join(' / '),st({b:false,red,fill:it.length?GRN:LAV}));
          else put(ws,R+1+cj,C+1+j,'-',st({fill:LAV}));
        });
      }
      
      const notes=[];
      if(isFer) notes.push(`★ FERIADO: ${S.feriados[kDay].name.toUpperCase()}`);
      if(S.notas && S.notas[kDay]) notes.push(`NOTA: ${S.notas[kDay].toUpperCase()}`);
      const fr=rows.filter(r=>r.st==='F').map(r=>r.p.name.toUpperCase());if(fr.length)notes.push('FRANCO: '+fr.join(', '));
      const au=rows.filter(r=>r.st==='A').map(r=>r.p.name.toUpperCase());if(au.length)notes.push('AUSENTE: '+au.join(', '));
      const vac=rows.filter(r=>r.st==='VAC').map(r=>r.p.name.toUpperCase());if(vac.length)notes.push('VACACIONES: '+vac.join(', '));
      const med=rows.filter(r=>r.st==='MED').map(r=>r.p.name.toUpperCase());if(med.length)notes.push('LIC. MÉDICA: '+med.join(', '));
      const est=rows.filter(r=>r.st==='EST').map(r=>r.p.name.toUpperCase());if(est.length)notes.push('DÍA ESTUDIO: '+est.join(', '));
      rows.filter(r=>r.st==='W'&&r.ac).forEach(r=>notes.push(`${r.p.name.toUpperCase()} ${SHN[r.sh].toUpperCase()} ${hh(r.ini)} A ${hh(r.fin)} (CAJA ${r.caja} - AT. CLIENTE)`));
      rows.filter(r=>r.st==='W'&&r.x&&r.x.pat&&(S.cajasAC||[]).includes(+r.x.caja||1)).forEach(r=>notes.push(`${r.p.name.toUpperCase()} ${hh(r.x.ini)} A ${hh(r.x.fin)} (CAJA ${r.x.caja} - AT. CLIENTE)`));
      const c=count(rows);['M','T'].forEach(sh=>{if(w[sh]&&c[sh]<w['n'+sh])notes.push(`FALTA${w['n'+sh]-c[sh]>1?'N':''} ${w['n'+sh]-c[sh]} EN TURNO ${SHN[sh].toUpperCase()}`)});
      
      const numNotes = Math.max(4, notes.length);
      for(let n=0;n<numNotes;n++){
        const rr=R+2+S.cajas+n;
        put(ws,rr,C,notes[n]||'',st({left:true,nb:true,red:/FALTA|AUSENTE|MÉDICA/.test(notes[n]||'')}));
        merges.push({s:{r:rr,c:C},e:{r:rr,c:C+2}});
        maxR=Math.max(maxR,rr);
      }
    });
    ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:maxR,c:6}});
    ws['!merges']=merges;ws['!cols']=[{wch:10},{wch:26},{wch:26},{wch:3},{wch:10},{wch:26},{wch:26}];
    XLSX.utils.book_append_sheet(wb,ws,`Sem ${wi+1} (${pad(wk[0].getDate())} al ${pad(wk[wk.length-1].getDate())})`);
  });

  // Hoja 3: Horas Extras usando el motor unificado
  const he = {}; let rHe = 0;
  put(he, rHe, 0, 'REPORTE DE HORAS EXTRAS', st({b:true, left:true, nb:true})); rHe+=2;
  put(he, rHe, 0, 'PERSONA', st({b:true, fill:HDR}));
  put(he, rHe, 1, 'HS EXTRAS EN EL MES', st({b:true, fill:HDR}));
  put(he, rHe, 2, 'DETALLE POR DÍA', st({b:true, fill:HDR, left:true}));
  rHe++;
  
  const statsXls = computeOvertimeStats(days[0], days[days.length-1]);
  statsXls.forEach(stItem => {
      const totH = Math.floor(stItem.finalExtras / 60); const totM = stItem.finalExtras % 60;
      const valStr = stItem.finalExtras > 0 ? (totM > 0 ? totH+'h '+totM+'m' : totH+'h') : '0h';
      put(he, rHe, 0, stItem.p.name.toUpperCase(), st({b:true, fill:LAV, left:true}));
      put(he, rHe, 1, valStr, st({b:true, red: stItem.finalExtras > 0}));
      put(he, rHe, 2, stItem.details.map(d => d.replace(/<[^>]+>/g,'')).join(' | '), st({left:true}));
      rHe++;
  });
  he['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:rHe-1, c:2}});
  he['!cols'] = [{wch:16}, {wch:22}, {wch:60}];
  XLSX.utils.book_append_sheet(wb, he, 'Horas Extras');
  
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  XLSX.writeFile(wb, `Turnos ${MESES[M]} ${Y}.xlsx`);
  toast('Excel descargado');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') close();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    if (e.shiftKey) { e.preventDefault(); redo(); }
    else { e.preventDefault(); undo(); }
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
    e.preventDefault(); redo();
  }
});
